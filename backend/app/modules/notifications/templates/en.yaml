# =============================================================================
# AIVIS.ONE Backend -- Notification Templates (English)
# =============================================================================
#
# Structure: {notification_type}.{channel}.{field}
#   telegram: body only (plain text, Telegram MarkdownV2 not used for safety)
#   email:    subject + body (plain text, HTML templates are future scope)
#
# Variables use Python str.format_map syntax: {variable_name}
# SafeDict ensures missing variables render as "{variable_name}" not KeyError.
#
# Sprint 8.2
# =============================================================================

system:
  telegram:
    body: "{title}\n\n{body}"
  email:
    subject: "AIVIS.ONE: {title}"
    body: |
      {title}

      {body}

      --
      AIVIS.ONE Platform

transaction:
  telegram:
    body: "Transaction: {title}\n\n{body}\n\nAmount: ${amount}"
  email:
    subject: "AIVIS.ONE Transaction: {title}"
    body: |
      {title}

      {body}

      Amount: ${amount}

      --
      AIVIS.ONE Platform

commission:
  telegram:
    body: "Commission earned!\n\n{body}\n\nAmount: ${amount}"
  email:
    subject: "AIVIS.ONE: Commission Earned"
    body: |
      {title}

      {body}

      Commission amount: ${amount}

      --
      AIVIS.ONE Platform

news:
  telegram:
    body: "{title}\n\n{body}"
  email:
    subject: "AIVIS.ONE News: {title}"
    body: |
      {title}

      {body}

      --
      AIVIS.ONE Platform

installment:
  telegram:
    body: "Installment update: {title}\n\n{body}\n\nAmount: ${amount}\nDue: {due_date}"
  email:
    subject: "AIVIS.ONE Installment: {title}"
    body: |
      {title}

      {body}

      Amount due: ${amount}
      Due date: {due_date}

      --
      AIVIS.ONE Platform
