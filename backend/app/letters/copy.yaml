# =============================================================================
# AIVIS -- the words of every e-mail letter, both languages
# =============================================================================
#
# The one copy of a letter's words. The backend's letter builder
# (app/letters/__init__.py) writes them into a layout (layouts/<layout>.html)
# for the html part and into the same layout's plain shape for the text part,
# so the two parts of a letter cannot say different things.
#
# `common` -- the words every letter shares (the footer) and the words of the
#   digest layout, per language.
# `types`  -- one entry per letter type: `layout` names the layout, and the
#   keys under `en` and `ru` are that layout's SLOTS (README.md lists them)
#   plus:
#     subject              -- the letter's subject;
#     bell_title/bell_body -- the short text of the cabinet's notification
#                             bell, only for a type that also lands there
#                             (comms-profile/types.yaml `channels` with
#                             in_app). A type without them sends its subject
#                             and heading as the notification's title and
#                             body, which comms requires and stores but
#                             shows nowhere.
#   `sent: false` marks a letter nothing sends yet.
#
# A word may carry data variables in {name} form; the emitter supplies them
# and the builder HTML-escapes each value in the html part. The builder's
# loader refuses this file on a missing or extra slot, a missing language, a
# blank word, a key written twice, or a NUL -- at import, so neither the
# application nor the test suite starts on a broken file.
#
# No domain literals: every address is a variable (core/email_vars.py
# letter_vars; checks/deploy_addresses.py scans this file).
# =============================================================================

common:
  en:
    footer_company: "AIVIS.ONE LLC, Georgia. This is an automatic letter, replies are not read."
    footer_support: "Support:"
    footer_bot: "Telegram bot"
    read_more: "Read more"
