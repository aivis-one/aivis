# =============================================================================
# AIVIS.ONE Backend -- Alembic Configuration
# =============================================================================
#
# KEY COMMANDS:
#   alembic revision --autogenerate -m "description"  -- create migration
#   alembic upgrade head                               -- apply all pending
#   alembic downgrade -1                               -- rollback last one
#   alembic history                                    -- show all migrations
#   alembic current                                    -- show current revision
#
# NOTE: sqlalchemy.url is set dynamically in migrations/env.py from .env.
#   The placeholder below is never actually used.
# =============================================================================

[alembic]
script_location = migrations

# Filename template: 2026_04_01_abc123_initial_schema.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Overridden in env.py -- placeholder only.
sqlalchemy.url = placeholder://set-in-env-py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
