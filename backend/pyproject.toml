# =============================================================================
# AIVIS.ONE Backend -- Project Configuration
# =============================================================================
#
# Single source of truth for dependencies and tool configuration.
# All versions are pinned with upper bounds to prevent breaking changes.
# =============================================================================

[project]
name = "aivis-backend"
version = "0.1.0"
description = "AIVIS.ONE -- Investment platform"
requires-python = ">=3.12"

dependencies = [
    # FastAPI 0.137 reworked include_router (a sub-router's routes are no
    # longer flattened into app.routes -- they sit behind a lazy
    # _IncludedRouter wrapper). Cap below the next minor so a rebuild
    # cannot silently pull an unvetted breaking release; bump the cap
    # deliberately after testing. A lock file would be the stronger fix.
    "fastapi>=0.115.0,<0.140",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "redis[hiredis]>=5.0.0,<6.0",
    "alembic>=1.13.0,<2.0",
    "pydantic-settings>=2.5.0,<3.0",
    "structlog>=24.0.0,<25.0",
    "email-validator>=2.0.0,<3.0",
    "argon2-cffi>=23.0.0,<24.0",
    "aiogram>=3.13.0,<4.0",
    "aiosmtplib>=3.0.0,<4.0",
    "pyyaml>=6.0.0,<7.0",
    "httpx>=0.27.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "xhtml2pdf>=0.2.13,<1.0",
    # Refactor 2 iter 2.1: async S3 client for MinIO-backed object storage.
    # Pulls in botocore, aiohttp, aioitertools as transitive deps. boto3
    # (sync) is intentionally NOT pinned -- everything async via aiobotocore.
    "aiobotocore>=2.13.0,<3.0",
    # Refactor 2 iter 2.2: required by FastAPI to parse multipart/form-data
    # bodies (UploadFile + Form). Used by the staff attachments router for
    # POST and PATCH /replace endpoints. FastAPI 0.115+ does NOT bundle
    # this -- it must be declared explicitly.
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.11.0,<2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# =============================================================================
# Ruff -- formatter + linter (replaces black + flake8 + isort)
# =============================================================================

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async linting
]
ignore = ["RUF012", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =============================================================================
# Mypy -- strict type checking
# =============================================================================

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/.pytest_cache"
filterwarnings = [
    "ignore:A custom validator is returning a value other than `self`:UserWarning:pydantic_settings",
]
