# =============================================================================
# AIVIS.ONE Backend -- Project Configuration
# =============================================================================
#
# Single source of truth for the dependencies this project DECLARES, and for tool
# configuration.
#
# Every direct dependency below carries both a lower floor and an upper cap. Their
# transitive dependencies carry neither: those are resolved afresh on every image
# build, and they are the majority of what actually ends up installed. Measured
# 2026-08-14 against the running container -- most of the installed set is not
# named in this file, including the framework FastAPI itself is built on.
#
# WHAT ACTUALLY INSTALLS is recorded outside this repository, in the project's
# private agent home. That is deliberate: publishing an exact version manifest of
# a live deployment is a disclosure this project does not make, and a published
# manifest would go stale at the next image build and then assert something untrue.
# Refresh the record read-only, changing nothing:
#     docker exec aivis-app pip freeze
# =============================================================================

[project]
name = "aivis-backend"
version = "0.1.0"
description = "AIVIS.ONE -- Investment platform"
requires-python = ">=3.12"

dependencies = [
    # FastAPI 0.137 reworked include_router (a sub-router's routes are no
    # longer flattened into app.routes -- they sit behind a lazy
    # _IncludedRouter wrapper). Cap below the next minor so a rebuild
    # cannot silently pull an unvetted breaking release; bump the cap
    # deliberately after testing. A lock file would be the stronger fix.
    "fastapi>=0.115.0,<0.140",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "redis[hiredis]>=5.0.0,<6.0",
    "alembic>=1.13.0,<2.0",
    "pydantic-settings>=2.5.0,<3.0",
    "structlog>=24.0.0,<25.0",
    "email-validator>=2.0.0,<3.0",
    "argon2-cffi>=23.0.0,<24.0",
    "aiogram>=3.13.0,<4.0",
    "aiosmtplib>=3.0.0,<4.0",
    "pyyaml>=6.0.0,<7.0",
    "httpx>=0.27.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "xhtml2pdf>=0.2.13,<1.0",
    # Refactor 2 iter 2.1: async S3 client for MinIO-backed object storage.
    # Pulls in botocore, aiohttp, aioitertools as transitive deps. boto3
    # (sync) is intentionally NOT pinned -- everything async via aiobotocore.
    "aiobotocore>=2.13.0,<3.0",
    # Refactor 2 iter 2.2: required by FastAPI to parse multipart/form-data
    # bodies (UploadFile + Form). Used by the staff attachments router for
    # POST and PATCH /replace endpoints. FastAPI 0.115+ does NOT bundle
    # this -- it must be declared explicitly.
    "python-multipart>=0.0.9,<1.0",
    # TASK-38 (2FA): RFC 6238 TOTP code generation/verification --
    # app/modules/users/service.py (setup_totp/confirm_totp_setup) and
    # app/modules/auth/service.py (login-time verification). Small,
    # dependency-free, widely used; deliberately NOT hand-rolled.
    "pyotp>=2.9.0,<3.0",
    # TASK-38 (2FA): was already importable transitively (pulled in by
    # httpx/aiobotocore's TLS stack) but undeclared. Now that
    # app/core/crypto.py imports it directly for at-rest encryption of
    # the TOTP secret (Fernet + HKDF), it needs to be a direct
    # dependency -- an undeclared transitive import can disappear on any
    # unrelated dependency bump. Floor/cap set around the version
    # actually installed in this seat (50.0.0, checked via
    # `python -c "import cryptography; print(cryptography.__version__)"`).
    "cryptography>=42.0.0,<51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    # A hang is not a test result. See [tool.pytest.ini_options] below.
    "pytest-timeout>=2.3.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.11.0,<2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# =============================================================================
# Ruff -- formatter + linter (replaces black + flake8 + isort)
# =============================================================================

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async linting
]
ignore = ["RUF012", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =============================================================================
# Mypy -- strict type checking
# =============================================================================

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/.pytest_cache"

# A RUN THAT HANGS REPORTS NOTHING. On a machine without MinIO the suite
# produced 17 fixture errors and then stopped dead: no summary, no exit
# code, no way to tell a slow run from a stuck one without attaching to
# the process.
#
# WHERE 120 COMES FROM, and it is not a round number picked by feel: the
# last full run was 311s for 518 tests, an average of 0.6s. A test twenty
# times slower than average is 12s, and this is an order of magnitude
# above that. Lower would start failing legitimate slow tests on a loaded
# box; much higher and a stuck run looks like a hang again.
timeout = 120

# THREAD, NOT SIGNAL. The signal method interrupts the test function
# only, and what hangs here is a FIXTURE waiting on a socket to a MinIO
# that is not there -- the very case this setting exists for. The thread
# method watches wall-clock time around the whole item, setup included.
timeout_method = "thread"
filterwarnings = [
    "ignore:A custom validator is returning a value other than `self`:UserWarning:pydantic_settings",
]
