<!-- AIVIS Date picker (K29): the browser's own date input drawn as a Text field: a visible label, input type=date, the allowed period as min and max (also written in the hint, aria-describedby), an invalid value with aria-invalid and a message with an icon and text. No script. -->
<div class="ds-field"><label class="ds-field__label" for="da-a">Document date</label><input class="ds-input" id="da-a" type="date" min="2026-10-05" max="2026-10-25" value="2026-10-12" aria-describedby="da-a-h"><p class="ds-field__hint" id="da-a-h">From 5 to 25 October 2026.</p></div>
<div class="ds-field"><label class="ds-field__label" for="da-b">Document date</label><input class="ds-input" id="da-b" type="date" min="2026-10-05" max="2026-10-25" value="2026-10-30" aria-invalid="true" aria-describedby="da-b-h da-b-e"><p class="ds-field__hint" id="da-b-h">From 5 to 25 October 2026.</p><p class="ds-field__error" id="da-b-e"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-alert-triangle"/></svg><span>Pick a date inside the period.</span></p></div>

<!-- K29 addition: the time input, drawn the same way (input type="time", the mono face, the browser's picker follows the theme). -->
<div class="ds-field"><label class="ds-field__label" for="ti-a">Quiet hours from</label><input class="ds-input" id="ti-a" type="time" value="22:00"></div>

<!-- K29 addition (batch 5): the date-and-time field, drawn the same way (input type="datetime-local", the mono face, the browser's picker follows the theme); min and max as YYYY-MM-DDTHH:MM. -->
<div class="ds-field"><label class="ds-field__label" for="dt-a">Starts</label><input class="ds-input" id="dt-a" type="datetime-local" min="2026-11-14T09:00" value="2026-11-14T18:30"></div>
