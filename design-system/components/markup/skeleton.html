<!-- AIVIS Skeleton (K19): a placeholder while content loads. The skeleton parts are aria-hidden; the region that will hold the content carries aria-busy="true" and one
     visible-to-assistive-technology status text (.ds-sr-only). When the content arrives, remove the skeletons and the status, and set aria-busy="false" (or remove it).
     Parts: --text, --title, --avatar, --block; .ds-skeleton-stack lays text lines out; .ds-skeleton-row is a row-list placeholder. -->
<section aria-busy="true" aria-labelledby="sk-h">
  <h2 id="sk-h" class="ds-sr-only">Transactions</h2>
  <span class="ds-sr-only" role="status">Loading</span>
  <div class="ds-rows" aria-hidden="true">
    <div class="ds-skeleton-row">
      <span class="ds-skeleton ds-skeleton--avatar"></span>
      <span class="ds-skeleton-stack"><span class="ds-skeleton ds-skeleton--title"></span><span class="ds-skeleton ds-skeleton--text"></span></span>
    </div>
    <div class="ds-skeleton-row">
      <span class="ds-skeleton ds-skeleton--avatar"></span>
      <span class="ds-skeleton-stack"><span class="ds-skeleton ds-skeleton--title"></span><span class="ds-skeleton ds-skeleton--text"></span></span>
    </div>
  </div>
</section>
