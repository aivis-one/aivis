<!-- AIVIS Toggle (K06): a native checkbox with role="switch"; the state is carried by the position of the knob and the colour of the track,
     and by the switch role. The label is the text before the control; keep it a statement ("E-mail notifications"), not an action. -->
<label class="ds-toggle">
  <span class="ds-toggle__text"><span>E-mail notifications</span><span class="ds-toggle__hint">News and payment receipts.</span></span>
  <input class="ds-toggle__input" type="checkbox" role="switch" checked>
  <span class="ds-toggle__track" aria-hidden="true"></span>
</label>
<label class="ds-toggle">
  <span class="ds-toggle__text"><span>Two-factor sign-in</span></span>
  <input class="ds-toggle__input" type="checkbox" role="switch">
  <span class="ds-toggle__track" aria-hidden="true"></span>
</label>
<label class="ds-toggle">
  <span class="ds-toggle__text"><span>Beta features</span></span>
  <input class="ds-toggle__input" type="checkbox" role="switch" disabled>
  <span class="ds-toggle__track" aria-hidden="true"></span>
</label>
