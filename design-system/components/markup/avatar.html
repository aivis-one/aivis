<!-- AIVIS Avatar (K50): a photo or the initials on a disc. Sizes data-size="sm" (32), the default (40) and "lg" (56). The initials sit on --primary in --on-primary; .ds-avatar--subtle is the quiet disc (--primary-subtle).
     A photo is an img with alt text that names the person or the company; initials are a span with role="img" and aria-label, or aria-hidden when the name stands beside the disc. -->
<span class="ds-avatar" role="img" aria-label="Anna Weber">AW</span>
<span class="ds-avatar ds-avatar--subtle" data-size="lg" role="img" aria-label="Brenner Logistik GmbH">BL</span>
<span class="ds-avatar" data-size="sm"><img src="person.jpg" alt="Anna Weber"></span>
