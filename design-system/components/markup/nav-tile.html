<!-- AIVIS Nav tile (K34): the whole tile is one link (a.ds-navtile); the icon box, the title, an optional description and an optional badge are inside it, the chevron
     ends the row. A tile that cannot be opened yet carries aria-disabled="true" and no href. Tiles sit in .ds-navtiles (a grid, one column on a phone). -->
<div class="ds-navtiles">
  <a class="ds-navtile" href="/transactions">
    <span class="ds-navtile__icon"><svg class="ds-icon ds-icon--md" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-history"/></svg></span>
    <span class="ds-navtile__text"><span class="ds-navtile__title">Transactions</span><span class="ds-navtile__desc">Deposits and purchases</span></span>
    <svg class="ds-icon ds-navtile__go" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
  </a>
  <a class="ds-navtile" href="/events">
    <span class="ds-navtile__icon"><svg class="ds-icon ds-icon--md" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-calendar-days"/></svg></span>
    <span class="ds-navtile__text"><span class="ds-navtile__title">Events</span><span class="ds-navtile__desc">What is coming</span></span>
    <span class="ds-navtile__badge ds-badge ds-badge--info">2 new</span>
    <svg class="ds-icon ds-navtile__go" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
  </a>
</div>
