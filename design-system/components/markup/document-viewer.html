<!-- AIVIS Document sheet and viewer (K36): a dialog. data-variant="sheet" (default: a bottom sheet, the cabinet's AgreementSheet) or "modal" (centred, the cabinet's LegalDocModal).
     Open it with a button that has data-docviewer-open="<viewer id>"; the viewer starts hidden. The focus moves to the dialog (named by its heading), Tab stays inside, Escape, the close button and the scrim close it, and the focus returns to the opener (components.js).
     The body is a scrollable region with tabindex="0" and a name, so the keyboard can scroll it. The document is either in-page HTML (below) or a sandboxed iframe.ds-docviewer__frame (sandbox="" always: the cabinet's rule).
     States: closed, open, loading (aria-busy="true" on the body, a Loader and the status text), loaded, error (an Alert with a retry). The download is a real link; the app writes its href and file name.
     ds-docviewer--inline draws the dialog in the flow of a page (specimens and screens that embed it). The English strings are examples; no price and no payment term is part of this component. -->
<button type="button" class="ds-button ds-button--secondary" data-size="sm" data-docviewer-open="dv-1">View agreement</button>

<div class="ds-docviewer" id="dv-1" data-variant="sheet" hidden>
  <div class="ds-docviewer__dialog" role="dialog" aria-modal="true" aria-labelledby="dv-1-t" tabindex="-1">
    <div class="ds-docviewer__head">
      <h2 class="ds-docviewer__title" id="dv-1-t">Purchase agreement</h2>
      <button type="button" class="ds-button ds-button--ghost ds-button--icon" data-size="sm" aria-label="Close" data-docviewer-close><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
    </div>
    <div class="ds-docviewer__body" tabindex="0" role="region" aria-labelledby="dv-1-t">
      <h1>Sample agreement</h1>
      <p>This is sample text. The real document is the HTML the cabinet receives for the purchase.</p>
      <h2>1. Sample clause</h2>
      <p>Sample clause text.</p>
    </div>
    <div class="ds-docviewer__actions">
      <button type="button" class="ds-button ds-button--secondary" data-docviewer-close>Close</button>
      <a class="ds-button ds-button--primary" href="/files/agreement.html" download="agreement.html"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-download"/></svg>Save a copy</a>
    </div>
  </div>
</div>

<!-- loading and error bodies -->
<div class="ds-docviewer__body" tabindex="0" role="region" aria-labelledby="dv-1-t" aria-busy="true"><span class="ds-docviewer__status" role="status">Loading the document...</span></div>
<div class="ds-alert ds-alert--danger" role="alert"><span class="ds-alert__icon" aria-hidden="true"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-alert-triangle"/></svg></span><div class="ds-alert__content"><p class="ds-alert__title">The document did not load</p><p class="ds-alert__text">Try again in a moment.</p></div></div>
