<!-- AIVIS text parts (shared, not components): .ds-section-title is the heading of a section inside a screen (an h2 or an h3 at the h4 role: --font-display, --fs-h4, 700, --text-primary);
     .ds-note is a quiet small line (--fs-sm, --text-secondary), and .ds-note--xs the caption size (--fs-xs). Both stand on the surface, the page and the card ground. The heading level fits the page.
     .ds-amount is the summary amount of a sheet or a dialog (mono, tabular, --fs-2xl; data-size="sm" takes the size of the text around it; data-tone="success|danger" paints it, the sign says the same);
     .ds-label is the small uppercase caption (--fs-xs, --text-secondary; data-size="md" takes --fs-sm). -->
<h2 class="ds-section-title">Your holdings</h2>
<p class="ds-note">Figures are updated every morning.</p>
<p class="ds-note ds-note--xs">Updated 24 Oct 2026, 09:00.</p>
<p class="ds-label">Pending</p>
<p class="ds-label" data-size="md">Deposit</p>
<p class="ds-amount">+1,250.00 USDT</p>
<p class="ds-amount" data-tone="success">+1,250.00 USDT</p>
<p class="ds-amount" data-tone="danger">-340.50 USDT</p>
<p class="ds-dialog__text">Reverse the payment of <span class="ds-amount" data-size="sm" data-tone="danger">-340.50 USDT</span>?</p>
