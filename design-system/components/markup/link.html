<!-- AIVIS Link (K58): a link is always underlined, never colour alone. Two forms.

     weight 600, at least --touch-min high; an icon from the sprite before or after its words is allowed.
     States: rest, hover (the line thickens), pressed, focus (the system outline). An external link carries rel="noopener". -->
