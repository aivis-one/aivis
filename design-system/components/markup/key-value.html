<!-- AIVIS Key-value list (K49): a dl, one div.ds-kv__row per pair, the term at the start and the value at the end in the mono face (the price breakdown, a balance line, the fields of an invoice, the details of a transaction).
     .ds-kv__row--total closes a breakdown (a rule above, the bolder pair). .ds-kv--stacked puts the term over the value, for a narrow column. The values are filled by the app; the English strings are examples. -->
<dl class="ds-kv">
  <div class="ds-kv__row"><dt>Units</dt><dd>4</dd></div>
  <div class="ds-kv__row"><dt>Price per unit</dt><dd>300.00</dd></div>
  <div class="ds-kv__row"><dt>Fee</dt><dd>12.00</dd></div>
  <div class="ds-kv__row ds-kv__row--total"><dt>Total</dt><dd>1,212.00</dd></div>
</dl>
<dl class="ds-kv ds-kv--stacked">
  <div class="ds-kv__row"><dt>Network</dt><dd>TRC20</dd></div>
  <div class="ds-kv__row"><dt>Deadline</dt><dd>25 Oct 2026, 18:00</dd></div>
</dl>
