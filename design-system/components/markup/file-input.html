<!-- AIVIS File input (K30). A real input type=file inside the label that draws the button; the limits are text under it. The page fills data-accept, data-max-size (bytes), data-msg-type, data-msg-size ({name} and {max}), data-msg-ready, data-msg-done and data-label-remove ({name}) from the translation tables. components.js lists the chosen files, checks type and size, previews an image locally and fires ds-file-select, ds-file-reject and ds-file-remove; the app uploads and calls AivisDS.file.progress(item, pct), .done(item) and .fail(item, message). Every item state is shown. -->
<div class="ds-field ds-file" id="fi-a" data-accept=".jpg,.jpeg,.png" data-max-size="8388608" data-msg-type="{name}: this file type is not allowed." data-msg-size="{name}: the file is larger than {max}." data-msg-ready="Ready to upload" data-msg-done="Uploaded" data-label-remove="Remove {name}"><span class="ds-field__label" id="fi-a-l">Passport, front side</span><label class="ds-button ds-button--secondary ds-file__pick"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-upload"/></svg><span>Choose file</span><input class="ds-file__input" type="file" accept=".jpg,.jpeg,.png" aria-labelledby="fi-a-l" aria-describedby="fi-a-h"></label><p class="ds-field__hint" id="fi-a-h">JPG or PNG, up to 8 MB.</p><ul class="ds-file__list" aria-live="polite"><li class="ds-file__item" data-state="selected"><span class="ds-file__thumb"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-image"/></svg></span><span class="ds-file__body"><span class="ds-file__name">passport-front.jpg</span><span class="ds-file__meta ds-file__status">1.2 MB &middot; Ready to upload</span></span><span class="ds-file__aside"><button type="button" class="ds-file__remove" aria-label="Remove passport-front.jpg"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></span></li><li class="ds-file__item" data-state="uploading"><span class="ds-file__thumb"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-image"/></svg></span><span class="ds-file__body"><span class="ds-file__name">passport-back.jpg</span><span class="ds-file__meta ds-file__status">1.1 MB &middot; 60%</span></span><span class="ds-file__aside"><button type="button" class="ds-file__remove" aria-label="Remove passport-back.jpg"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></span><div class="ds-progress ds-file__progress"><div class="ds-progress__track" role="progressbar" aria-label="passport-back.jpg" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60"><span class="ds-progress__fill" style="--value: 60%"></span></div></div></li><li class="ds-file__item" data-state="done"><span class="ds-file__thumb"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-image"/></svg></span><span class="ds-file__body"><span class="ds-file__name">selfie.png</span><span class="ds-file__meta ds-file__status">640 KB &middot; Uploaded</span></span><span class="ds-file__aside"><span class="ds-badge ds-badge--success">Uploaded</span><button type="button" class="ds-file__remove" aria-label="Remove selfie.png"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></span></li><li class="ds-file__item" data-state="error"><span class="ds-file__thumb"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-file-text"/></svg></span><span class="ds-file__body"><span class="ds-file__name">scan.pdf</span><span class="ds-file__meta ds-file__status">2.4 MB</span></span><span class="ds-file__aside"><button type="button" class="ds-file__remove" aria-label="Remove scan.pdf"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></span><p class="ds-field__error" role="alert"><svg class="ds-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-alert-triangle"/></svg><span>scan.pdf: this file type is not allowed.</span></p></li></ul></div>
