<!-- AIVIS Progress (K18, kit fix: progressbar role). role="progressbar" with aria-valuenow, aria-valuemin, aria-valuemax and an accessible name;
     the fill width is the custom property --value on the fill. Indeterminate: no aria-valuenow. -->
<div class="ds-progress">
  <div class="ds-progress__label"><span id="pg1">Funding</span><span>60%</span></div>
  <div class="ds-progress__track" role="progressbar" aria-labelledby="pg1" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60"><span class="ds-progress__fill" style="--value: 60%"></span></div>
</div>
<div class="ds-progress ds-progress--indeterminate">
  <div class="ds-progress__track" role="progressbar" aria-label="Uploading"><span class="ds-progress__fill"></span></div>
</div>
