<!-- AIVIS Stepper (K32): an ordered list; the step in progress carries aria-current="step". A step is data-state done, current, upcoming or problem.
     The state is never colour alone: done holds a check, problem a triangle, the others their number, and the meta line says it in words ("Done", "Current", "Upcoming", "Needs your attention").
     data-orientation="horizontal" lays the steps in a row from 640 up; below it, and on a phone, they stack. The list is named by aria-label or aria-labelledby. -->
<ol class="ds-stepper" aria-label="Review steps">
  <li class="ds-step" data-state="done">
    <span class="ds-step__marker" aria-hidden="true"><svg class="ds-icon" viewBox="0 0 24 24"><use href="#i-check"/></svg></span>
    <span class="ds-step__body"><span class="ds-step__title">Submitted</span><span class="ds-step__meta">Done</span></span>
  </li>
  <li class="ds-step" data-state="current" aria-current="step">
    <span class="ds-step__marker" aria-hidden="true">2</span>
    <span class="ds-step__body"><span class="ds-step__title">Reviewed</span><span class="ds-step__meta">Current</span></span>
  </li>
  <li class="ds-step" data-state="upcoming">
    <span class="ds-step__marker" aria-hidden="true">3</span>
    <span class="ds-step__body"><span class="ds-step__title">Signed</span><span class="ds-step__meta">Upcoming</span></span>
  </li>
</ol>

<!-- The schedule list: an ol of li.ds-schedule__item, each a title and a Badge with the state in words (done, current, upcoming); the current item carries aria-current="step".
     data-status="problem" tints an item that needs attention. A dl.ds-schedule__stats and a p.ds-schedule__foot are optional: the screen fills them. -->
<ol class="ds-schedule" aria-label="Review list">
<li class="ds-schedule__item"><div class="ds-schedule__head"><span class="ds-schedule__num">Document received</span><span class="ds-badge ds-badge--success">Done</span></div></li>
<li class="ds-schedule__item" data-status="problem"><div class="ds-schedule__head"><span class="ds-schedule__num">Identity checked</span><span class="ds-badge ds-badge--danger">Needs your attention</span></div></li>
<li class="ds-schedule__item" aria-current="step"><div class="ds-schedule__head"><span class="ds-schedule__num">Address checked</span><span class="ds-badge ds-badge--info">Current</span></div></li>
<li class="ds-schedule__item"><div class="ds-schedule__head"><span class="ds-schedule__num">Approved</span><span class="ds-badge">Upcoming</span></div></li>
</ol>

<!-- K32 addition: step dots. ol.ds-dots of li.ds-dots__dot; the current one carries aria-current="step" and is wider (shape, not only colour). Say the position in words as well: the list has an aria-label ("Step 2 of 4") and a visible p.ds-dots__text may repeat it. -->
<ol class="ds-dots" aria-label="Step 2 of 4"><li class="ds-dots__dot"></li><li class="ds-dots__dot" aria-current="step"></li><li class="ds-dots__dot"></li><li class="ds-dots__dot"></li></ol>
