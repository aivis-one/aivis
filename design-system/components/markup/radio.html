<!-- AIVIS Radio (K05). Style ../components.css. A group is a fieldset with a legend; arrow keys move inside the group (native). -->
<fieldset class="ds-fieldset">
  <legend class="ds-fieldset__legend">Payout method</legend>
  <label class="ds-radio"><input class="ds-radio__input" type="radio" name="payout" value="usdt" checked><span class="ds-radio__dot" aria-hidden="true"></span><span>USDT wallet</span></label>
  <label class="ds-radio"><input class="ds-radio__input" type="radio" name="payout" value="bank"><span class="ds-radio__dot" aria-hidden="true"></span><span>Bank transfer<span class="ds-radio__hint">1 to 3 days</span></span></label>
  <label class="ds-radio"><input class="ds-radio__input" type="radio" name="payout" value="card" disabled><span class="ds-radio__dot" aria-hidden="true"></span><span>Card</span></label>
</fieldset>
