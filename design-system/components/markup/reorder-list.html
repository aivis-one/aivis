<!-- AIVIS Reorder list (K39): an ol named by a heading; each row has Move up and Move down buttons whose names include the row title (data-label-up and data-label-down with {name}); the button that cannot move is disabled. components.js moves the row, keeps the focus on the same button, marks the row data-moved until the focus leaves it, writes the polite status from data-msg-moved ({name}, {n}, {total}) into the element data-live names, and fires ds-reorder-change with the rows' data-id order. No drag.
     rest: -->
