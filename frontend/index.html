<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- THEME-COLOUR paints the browser/OS chrome, not the page, so nothing that
       measures the document can see it -- which is how the RETIRED brand teal
       survived the whole batch-6 repaint here while manifest.json (the same
       fact, declared twice) was correctly moved to azure. The old value is
       deliberately NOT quoted: this comment ships, and naming the literal
       would make every future zero-claim grep hit its own documentation.
       Values are
       --bg-page resolved per theme; theme-init.js and useTheme keep them in
       step with an EXPLICIT in-app choice, which no media query can see. -->
  <meta name="theme-color" content="#F6F8FA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#070A0E" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.json" />
  <!-- PNG first: every browser understands it, and the tab is where the old
       brand survived longest. The SVG stays for browsers that prefer it. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <title>AIVIS.ONE</title>
  <script src="/theme-init.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
