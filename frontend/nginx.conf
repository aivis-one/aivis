# =============================================================================
# AIVIS.ONE Frontend -- Internal Nginx (inside Docker container)
# SPA fallback, gzip, asset caching, port 3000
# =============================================================================
#
# This file is copied to /etc/nginx/conf.d/default.conf (frontend/Dockerfile),
# which the image's nginx.conf includes INSIDE its http {} block -- that is why
# a `map` may sit at the top of this file, outside `server`.
#
# ONE RULE FOR EVERY RESPONSE HEADER: all `add_header` lines live at `server`
# level, and NO `location` below carries one. nginx inherits `add_header` from
# the enclosing level ONLY into a location that declares none of its own; a
# single `add_header` in a location silently drops every inherited one. Until
# H22 (P-110) /assets/, /icons/, /manifest.json and /health each had one, and
# none of them carried the three security headers. The rule is enforced by
# checks/nginx_headers.py; a location that needs a different header value gets
# it through a map, never through its own `add_header`.

# -- Cache policy, by request path --
# $uri is the path AFTER internal redirects, so the SPA fallback (any route ->
# /index.html) and `/` (index -> /index.html) both land on the default below,
# exactly like /index.html requested directly.
#
# The default is `no-cache`: the browser keeps the file but revalidates it
# (ETag / Last-Modified -> 304) on every use. It covers every file whose name
# does NOT change when its content does: the entry document, the service worker
# (sw.js, registerSW.js, sw-update.js, workbox-*.js), theme-init.js, fonts and
# the legal / faq documents. Without a Cache-Control header a browser may cache
# such a file heuristically and serve a previous build's entry document.
#
# Only /assets/ is immutable: Vite puts a content hash in every file name there.
# An empty value makes nginx omit the header, which /health wants.
map $uri $aivis_cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~^/icons/           "public, max-age=2592000";
    /manifest.json      "public, max-age=86400";
    /health             "";
    default             "no-cache";
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    # The absolute last entry sends a directory that has no index.html of its
    # own (public/legal/, public/faq/, public/fonts/) to the SPA entry document
    # instead of a 403.
    index index.html /index.html;

    # -- Gzip --
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # -- Response headers: the ONLY add_header lines in this file (see top) --
    # Cache-Control has no `always`: an error page (a 404 for a missing
    # /assets/ file) must not be stored as immutable. The security headers
    # carry `always` so that error pages have them too.
    add_header Cache-Control $aivis_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src 'self' blob:; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; connect-src 'self' https://api.aivis.one https://fonts.googleapis.com https://fonts.gstatic.com" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -- Hashed build output and static files: a missing file is a 404 --
    location /assets/ {
        try_files $uri =404;
    }

    location /icons/ {
        try_files $uri =404;
    }

    location /manifest.json {
        try_files $uri =404;
    }

    # -- SPA fallback: all routes -> index.html --
    # No `$uri/` here: it matched a directory such as /legal and answered with a
    # redirect to /legal/ and then a 403. A path ending in `/` is still tested
    # as a directory by `$uri` and then resolved by `index` above.
    location / {
        try_files $uri /index.html;
    }

    # -- No access logs for health checks --
    # default_type, not add_header Content-Type: the latter ADDED a second
    # Content-Type next to the default one and, being an add_header, dropped
    # the security headers from this location.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
