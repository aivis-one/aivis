# =============================================================================
# SERVICE REGISTRY -- what this product runs, and where each piece comes from
# =============================================================================
#
# Sourced by BOTH scripts/install_aivis.sh (which puts the services on a
# fresh box) and scripts/aivis-manage.sh (which keeps them updated), so
# the two can never disagree about a branch or a path. Adding an N-th
# service is ONE record here plus that service's own lifecycle script in
# its own repo -- no edit to the update cycle.
#
# THIS FILE IS CODE, not per-server config: it is tracked in git and
# byte-identical on every server of this product. What makes a server
# THIS server (domains, ports) lives in /opt/aivis/aivis.conf, written
# once at install.
#
# RECORD FORMAT (pipe-separated, order matters -- services are updated
# top to bottom, and the product goes LAST):
#
#   1 name        short id, used in output and in key/alias names
#   2 repo        GitHub slug (owner/repo)
#   3 dir         checkout path on the box
#   4 branch      branch EXPRESSION, see below
#   5 lifecycle   path to its deploy CLI, relative to dir
#                 -- or the literal "internal" for the product itself
#   6 updater     subcommand for that CLI (or the shell function to call
#                 when lifecycle is "internal")
#   7 access      GitHub deploy-key privilege this service's repo needs:
#                 "read" or "write". Declared, never inferred -- the
#                 operator instruction is materially different ("tick
#                 Allow write access" vs "leave it unticked"), and a
#                 claim about privilege must be written down where it can
#                 be reviewed, not derived from a name. Today only the
#                 product needs write: `aivis update` pushes the
#                 regenerated API types back. Services only pull.
#
# BRANCH EXPRESSIONS -- the registry says HOW to get the branch, never
# hardcodes a per-server value:
#
#   fixed:<branch>    the same branch everywhere
#   conf:<KEY>        read <KEY> from aivis.conf (per-server)
#
# There is no role: expression here. The donor registry has one because
# that product runs a test box and a prod box off one body; aivis has a
# single environment and nothing anywhere sets a role, so a role branch
# would be a case arm no input can reach.
#
# WHY fixed:main FOR BOTH RECORDS. aivis runs one stand on one branch, so
# a per-server branch key would be a knob with no consumer. The format
# also allows a per-product service branch (e.g. `fixed:comms/aivis`) --
# cheap to switch, ONE cell, no code change -- but using it starts a
# rent: every fix has to be carried to each product branch, and alembic
# revisions can fork the migration graph, which is expensive to unfork.
# If you ever do switch, keep these three rules: main stays the ANCESTOR
# of every product branch; a branch is the last resort (try the profile
# or an env knob first -- both are already per-product); and migrations
# are authored on main only. `aivis update` warns when a service branch
# is not a descendant of main, so the drift is visible from day one.
#
# WHAT CHANGES BECAUSE THIS FILE EXISTS: the update cycle used to take
# the product branch from whatever was checked out (`git branch
# --show-current`). It now takes it from the record below. That is not a
# side effect of the registry, it is the point of it -- a checkout that
# drifted onto another branch is realigned and said out loud, instead of
# quietly becoming what this server tracks.
# =============================================================================

# shellcheck disable=SC2034  # consumed by whoever sources this file
AIVIS_SERVICES=(
    "comms|aivis-one/comms|/opt/comms/repo|fixed:main|deploy/comms-deploy.sh|update|read"
    "payments|aivis-one/payments|/opt/payments/repo|fixed:main|deploy/payments-deploy.sh|update|read"
    "aivis|aivis-one/aivis|/opt/aivis/repo|fixed:main|internal|update_product|write"
)

# Example -- a third service is exactly this much work (its own repo
# ships its own deploy CLI; nothing in the update cycle changes):
#
#   "billing|aivis-one/billing|/opt/billing/repo|fixed:main|deploy/billing-deploy.sh|update|read"
#
# ONE REQUIREMENT ON THE SERVICE'S OWN REPOSITORY, and it is not enforceable
# from here: its compose file must DECLARE its project name -- `name: billing`
# as the first line -- and pin its volume names. Compose otherwise infers the
# project from the directory holding the file, so two services whose files both
# live in `deploy/` become ONE project: `ps` from either lists the other's
# containers, and `down --remove-orphans` from either destroys the other. The
# inferred name also prefixes every volume, so it decides where the data is.
#
# Adding it to a FRESH server: install picks it up from this file --
# including its GitHub deploy key, which install provisions by looping
# over these records (no per-service code).
#
# Adding it to a LIVE server: reinstall. There is deliberately no
# `aivis add-service`.

# Field accessor: svc_field <record> <1-based index>.
svc_field() {
    local record="$1" index="$2"
    local IFS='|'
    # shellcheck disable=SC2206  # deliberate word-splitting on IFS
    local fields=($record)
    # `:-` is load-bearing under `set -u` (install_aivis.sh runs
    # `set -euo pipefail`): asking a SHORT record for a field it does not
    # carry -- a record written before field 7 existed, or one copied
    # from an older example -- would otherwise abort the whole script
    # with "unbound variable" instead of letting the caller report which
    # service is missing which field. An absent field reads as empty;
    # validating it is the caller's business.
    printf '%s' "${fields[$((index - 1))]:-}"
}

# Resolve a branch EXPRESSION against this server's config. Prints the
# branch, or fails loudly -- an unresolvable branch must never fall back
# to "whatever is checked out": that is the drift this replaced.
svc_branch() {
    local expr="$1" name="${2:-service}"
    case "$expr" in
        fixed:*)
            printf '%s' "${expr#fixed:}"
            ;;
        conf:*)
            local key="${expr#conf:}" value=""
            value="${!key:-}"
            if [ -z "$value" ]; then
                echo "FATAL: $name branch is '$expr' but $key is not set in aivis.conf" >&2
                return 1
            fi
            printf '%s' "$value"
            ;;
        *)
            echo "FATAL: $name has an unknown branch expression '$expr'" >&2
            return 1
            ;;
    esac
}
