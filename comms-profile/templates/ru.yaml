# =============================================================================
# AIVIS -- comms product profile: e-mail texts, Russian
# =============================================================================
#
# The same types and the same variables as en.yaml; comms picks this file for
# a recipient whose locale is `ru` and falls back to the deploy's default
# locale for any text missing here.

auth.verification_code:
  email:
    subject: "Код подтверждения AIVIS"
    body: |-
      Ваш код подтверждения: {code}

      Код действует {minutes} минут. Никому его не сообщайте.

      Если вы его не запрашивали, просто проигнорируйте это письмо.

      AIVIS.ONE

auth.password_reset:
  email:
    subject: "Сброс пароля AIVIS"
    body: |-
      Мы получили запрос на сброс вашего пароля AIVIS.

      Сбросить пароль: {reset_url}

      Ссылка работает один раз и действует {minutes} минут. Если вы не
      запрашивали сброс, проигнорируйте письмо: пароль останется прежним.

      AIVIS.ONE

purchase.agreement:
  email:
    subject: "Договор покупки {agreement_number}"
    body: |-
      Здравствуйте, {investor_name}!

      Ваш договор покупки готов.

      Договор: {agreement_number}
      Компания: {company}
      Продукт: {product}
      Долей: {units}
      Оплачено: {total_paid} $

      Открыть договор (потребуется вход в кабинет): {documents_url}

      Вопросы: {support_url} или {support_email}

      AIVIS.ONE

ownership.certificate:
  email:
    subject: "Свидетельство о владении: {company}"
    body: |-
      Здравствуйте, {investor_name}!

      Ваше свидетельство о владении в компании {company} готово.

      Долей во владении: {total_units}
      Текущая стоимость: {current_value} $
      На дату: {as_of}

      Открыть свидетельство (потребуется вход в кабинет): {documents_url}

      Вопросы: {support_url} или {support_email}

      AIVIS.ONE

withdrawal.processing:
  email:
    subject: "Вывод средств одобрен"
    body: |-
      Ваш вывод на сумму {amount} $ одобрен и находится в обработке.

      Следить за ним можно в кабинете: {cabinet_url}

      Вопросы: {support_url} или {support_email}

      AIVIS.ONE

withdrawal.completed:
  email:
    subject: "Вывод средств выполнен"
    body: |-
      Ваш вывод на сумму {amount} $ отправлен.

      Операция отражена в истории кабинета: {cabinet_url}
      Если вы её не совершали, сразу напишите нам: {support_url}

      AIVIS.ONE

withdrawal.rejected:
  email:
    subject: "Вывод средств отклонён"
    body: |-
      Ваш вывод на сумму {amount} $ отклонён.

      Причина: {reason}

      Сумма возвращена на ваш баланс: {cabinet_url}

      Вопросы: {support_url} или {support_email}

      AIVIS.ONE

withdrawal.failed:
  email:
    subject: "Вывод средств не удалось выполнить"
    body: |-
      Вывод на сумму {amount} $ не удалось выполнить.

      Сумма возвращена на ваш баланс: {cabinet_url}

      Вопросы: {support_url} или {support_email}

      AIVIS.ONE

installment.tranche_overdue:
  email:
    subject: "Платёж по рассрочке просрочен"
    body: |-
      Транш {tranche_number} вашей рассрочки на сумму {amount} $ не удалось
      списать: на балансе недостаточно средств.

      Пожалуйста, пополните баланс в кабинете: {cabinet_url}
      Списание будет повторено автоматически.

      Вопросы: {support_url} или {support_email}

      AIVIS.ONE

installment.plan_defaulted:
  email:
    subject: "Рассрочка расторгнута"
    body: |-
      Ваша рассрочка расторгнута из-за пропущенного платежа.

      Доли по уже оплаченным траншам остаются за вами. Оставшиеся транши
      отменены.

      Подробности в кабинете: {cabinet_url}
      Вопросы: {support_url} или {support_email}

      AIVIS.ONE
