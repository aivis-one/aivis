# =============================================================================
# AIVIS -- comms product profile: e-mail texts, English
# =============================================================================
#
# Format (comms app/profile/loader.py): {type: {channel: {field: template}}}.
# comms reads `subject` and `body` of the email channel; the body goes out as
# the letter's plain text. A template is str.format_map over the request's
# `action_data` plus `title` and `body`; the backend sends the variables each
# type uses (backend/app/core/email_vars.py carries the addresses). The
# profile may hold no domain literal, so every link is a variable. A type
# with no text here falls back to the title and body the backend stored.

auth.verification_code:
  email:
    subject: "Your AIVIS verification code"
    body: |-
      Your verification code is: {code}

      This code expires in {minutes} minutes. Never tell it to anyone.

      If you did not request it, ignore this letter.

      AIVIS.ONE

auth.password_reset:
  email:
    subject: "Reset your AIVIS password"
    body: |-
      We received a request to reset your AIVIS password.

      Reset it here: {reset_url}

      The link works once and expires in {minutes} minutes. If you did not
      ask for it, ignore this letter: your password stays the same.

      AIVIS.ONE

purchase.agreement:
  email:
    subject: "Purchase agreement {agreement_number}"
    body: |-
      Dear {investor_name},

      Your purchase agreement is ready.

      Agreement: {agreement_number}
      Company: {company}
      Product: {product}
      Units: {units}
      Total paid: ${total_paid}

      Open it here (you will be asked to sign in): {documents_url}

      Questions: {support_url} or {support_email}

      AIVIS.ONE

ownership.certificate:
  email:
    subject: "Ownership certificate: {company}"
    body: |-
      Dear {investor_name},

      Your ownership certificate for {company} is ready.

      Units owned: {total_units}
      Current value: ${current_value}
      As of: {as_of}

      Open it here (you will be asked to sign in): {documents_url}

      Questions: {support_url} or {support_email}

      AIVIS.ONE

withdrawal.processing:
  email:
    subject: "Your withdrawal is approved"
    body: |-
      Your withdrawal of ${amount} has been approved and is now processing.

      You can follow it in the cabinet: {cabinet_url}

      Questions: {support_url} or {support_email}

      AIVIS.ONE

withdrawal.completed:
  email:
    subject: "Your withdrawal is completed"
    body: |-
      Your withdrawal of ${amount} has been sent.

      The operation is in your cabinet history: {cabinet_url}
      If you did not make it, write to us at once: {support_url}

      AIVIS.ONE

withdrawal.rejected:
  email:
    subject: "Your withdrawal was rejected"
    body: |-
      Your withdrawal of ${amount} was rejected.

      Reason: {reason}

      The amount has been returned to your balance: {cabinet_url}

      Questions: {support_url} or {support_email}

      AIVIS.ONE

withdrawal.failed:
  email:
    subject: "Your withdrawal could not be completed"
    body: |-
      Your withdrawal of ${amount} could not be completed.

      The amount has been returned to your balance: {cabinet_url}

      Questions: {support_url} or {support_email}

      AIVIS.ONE

installment.tranche_overdue:
  email:
    subject: "Installment payment overdue"
    body: |-
      Tranche {tranche_number} of your installment plan, ${amount}, could not
      be charged because your balance is too low.

      Please top up your balance in the cabinet: {cabinet_url}
      The payment is retried automatically.

      Questions: {support_url} or {support_email}

      AIVIS.ONE

installment.plan_defaulted:
  email:
    subject: "Your installment plan was defaulted"
    body: |-
      Your installment plan was defaulted after a missed payment.

      You keep the units from the tranches already paid. The remaining
      tranches were cancelled.

      Details are in your cabinet: {cabinet_url}
      Questions: {support_url} or {support_email}

      AIVIS.ONE

# -- Support operator signals (H40 item 8; types.yaml says who gets them).
#    Telegram only: the in-app entry shows the stored title and body. The
#    variables are the signal's action_data (support/service.py
#    _emit_signal): sender_name, actor_name, topic_en / topic_ru. --

support.message_received:
  telegram:
    title: "<b>New message to support</b>"
    body: "{sender_name} wrote to support.\n\nTopic: {topic_en}"
    button_text: "Open the request"

support.ticket_assigned:
  telegram:
    title: "<b>A support request was handed to you</b>"
    body: "{actor_name} handed you a request from {sender_name}.\n\nTopic: {topic_en}"
    button_text: "Open the request"

support.ticket_released:
  telegram:
    title: "<b>A support request is back in the pool</b>"
    body: "{actor_name} returned a request from {sender_name} to the pool -- anyone can take it.\n\nTopic: {topic_en}"
    button_text: "Open the request"
