# =============================================================================
# AIVIS -- comms product profile: notification type dictionary
# =============================================================================
#
# The comms service carries NO product vocabulary: notification types and
# their preference categories are a per-product artifact living in the
# PRODUCT repo (comms/deploy/INTEGRATION.md section 3). The comms stack
# bind-mounts this directory read-only and reads it at startup.
#
# Format (comms app/profile/loader.py, schema version 2): the document is
# {version: 2, types: {type_key: {field: value}}}, and those two are the
# only top-level keys. comms reads exactly one schema version and refuses
# to start on any other, or on none. Types are a MAPPING, never a list --
# a list could not carry per-type fields. This file uses these fields:
# `category` (the mute gate), `channels` (where the type is delivered;
# absent = comms' default, in_app), `recipient_schedule` (`respect`,
# the default when absent, or `bypass`; needs comms >= 3.3.0), `lane`
# (`interactive`, `critical`, `normal` -- the default when absent -- or
# `bulk`; needs comms >= 3.4.0), and on the llm types of support
# translation (H39, at the end of this file) `llm_sets`, `push_on` and
# `expires_after`. Any value outside comms' own set refuses comms
# startup; the record table is comms deploy/INTEGRATION.md section 3.
# The type record is closed: an unknown key refuses comms startup; only `x-...` keys are tolerated.
# Widths from comms app/core/constants.py: a type key is <= 50 chars
# (MAX_TYPE_KEY_LEN), a category <= 50 chars (MAX_CATEGORY_LEN).
#
# WHY THE FIRST THREE TYPES EXISTED BEFORE ANY OF THIS PRODUCT'S OWN, AND
# WHY THEY COULD NOT WAIT
# -------------------------------------------------------------------------
# aivis product types (bookings, wallet, verification and the rest of the
# domain dictionary) arrive incrementally, together with the emitters that
# raise them -- declaring a type before its emitter exists would describe
# behaviour that does not. Batch 3 (2026-08-27) is the first delivery: the
# `kyc.*` types below, emitted from `kyc/service.py::_write_decision`. Read
# its own section for what is specific to it; this section is about the
# three msg.* keys only.
#
# The three msg.* keys are different: they are not aivis types at all. comms
# emits them ITSELF, unconditionally -- chat is a core capability of the
# service, not a feature of the product wired to it. Its loader enforces that in
# _require_msg_type_categories, which runs before templates are even
# parsed: every one of MSG_TYPE_KEYS must be declared here WITH a non-empty
# category, or the profile is rejected and comms does not start. The reason
# is mechanical, not stylistic -- a type with no category bypasses the mute
# gate, so a forgotten category would make chat notifications impossible to
# silence. So the three must be here from the first commit that hands comms
# a profile, phase 2 or no phase 2.
#
# HOW THE CATEGORIES ARE SPLIT: BY ADDRESSEE SIDE, NOT BY THREAD KIND
# -------------------------------------------------------------------
# Established from the bodies of two comms functions in app/notifier.py
# (named without line numbers on purpose -- a function name survives a
# commit in a repository we do not control, a line number does not):
#
#   notify_new_message
#     - emits msg.participant_message to thread.client, and only when the
#       sender is NOT the client -- i.e. the staff side wrote to the person
#       who opened the conversation;
#     - emits msg.support_message to thread.assignee, the operator the
#       thread is assigned to.
#
#   _emit_close_notification
#     - emits msg.thread_closed to thread.client. Its docstring records
#       that only section threads are ever flagged for this notice, so it
#       can only ever mean "the request you opened was closed".
#
# So two of the three land on the person who opened the request and one
# lands on the staff member handling it. Grouping the client-facing pair
# is not a choice between two defensible layouts: they are the same
# conversation with support seen by the same person, and a mute that
# silenced the replies while letting the closing notice through would be a
# defect, not a preference.
#
#   support_messages -- reaches the person who opened the request
#   staff_messages   -- reaches the staff member handling it
#
# THE OTHER PRODUCT'S NAMES WERE DELIBERATELY NOT TAKEN
# -----------------------------------------------------
# velo maps the same three keys onto msg_participants / msg_support. Those
# names describe velo's shape, where a thread can run between two ordinary
# participants. aivis has no participant threads -- every thread is a
# support request between a person and staff -- so a preference toggle
# labelled "participant messages" would name something the user can never
# receive. Copying the names would have cost nothing today and misled every
# reader of the preferences screen from phase 3 onward.
#
# EDITING THIS FILE
# -----------------
# A type key declared TWICE, or a field written twice in one record,
# refuses comms startup: its loader records duplicate keys instead of
# letting YAML keep the last one silently.
#
# No external domain literals anywhere in this file, comments included.
# The comms startup fence rejects them in the data, but it never sees
# comments (the YAML parser drops them before the check runs), so in the
# comments this rule holds by authorship alone.
# =============================================================================

version: 2

types:

  # -- Reaches the person who opened the support request --

  msg.participant_message:
    category: support_messages

  msg.thread_closed:
    category: support_messages

  # -- Reaches the staff member the request is assigned to --

  msg.support_message:
    category: staff_messages

  # =============================================================================
  # aivis product types -- phase 2, batch 3 (2026-08-27)
  # =============================================================================
  #
  # THE FIRST AIVIS DOMAIN EVENT. Emitted by `kyc/service.py::_write_decision`,
  # the one function every KYC decision passes through, as
  # `f"kyc.{new_status}"` -- so the set of types raised here is exactly the
  # key set of `_KYC_DECISION_COPY` beside it, which is where each notice's
  # title and body come from too.
  #
  # TWO SERVICE ENTRIES REACH IT, both staff-driven, and both write decisions
  # by hand -- there is no automated decision path at all:
  #
  #   decide_by_application -- a decision on the open, paid session. Reached
  #       from the staff queue: POST /staff/kyc/{application_id}/approve and
  #       .../reject. Raises kyc.approved and kyc.rejected.
  #   decide_by_user        -- a decision on the person rather than on a
  #       session. Reached from the staff user card: POST
  #       /staff/kyc/users/{user_id}/approve and .../revoke. Raises
  #       kyc.approved and kyc.revoked.
  #
  # One type per outcome rather than one shared
  # `kyc.decision` type: it lets a future preference screen mute a rejection
  # notice differently from an approval one, and it matches the msg.* shape
  # above (one type = one specific meaning) rather than inventing a new one.
  # All three share ONE category so today they mute together; splitting the
  # category is free later if that turns out to be wanted.
  #
  # title/body are sent as literal English strings by the emitter; these in-app
  # types have no per-locale template (templates/<locale>.yaml holds the e-mail types only)
  # -- this matches every other backend-authored user-facing
  # string today (core/email.py has no locale branching either). Localizing
  # outbound notification copy is a real gap, but it is a PRE-EXISTING one
  # this batch does not newly create, and it is out of scope for a delivery
  # whose job is standing the pipe up, not building backend i18n from zero.

  kyc.approved:
    category: kyc

  kyc.rejected:
    category: kyc

  # A THIRD OUTCOME, ADDED 2026-09-08 (P-63), AND IT IS NOT A SECOND KIND
  # OF REFUSAL.
  #
  #   rejected -- how a PAID SESSION ends. The person submitted documents,
  #               they were not accepted, and they keep exactly the access
  #               they had while waiting: none. The way forward is to pay
  #               for another session.
  #   revoked  -- the withdrawal of an approval that was ALREADY IN FORCE.
  #               It is a second decision on a session that had already
  #               ended in approval, and the person LOSES access they were
  #               using, without having done anything to ask for it.
  #
  # So the two cannot share a notice. "You can start a new verification"
  # is the right thing to say to someone who was refused and the wrong
  # thing to say to someone who has just been cut off from a platform they
  # were already inside -- which is why the emitter carries separate copy
  # for it, and why it needs its own type here rather than reusing the
  # rejection's.
  #
  # Same category as the pair above, for the reason this section already
  # gives.

  kyc.revoked:
    category: kyc

  # =============================================================================
  # aivis product types -- phase 2, batch 3 continued (2026-08-27)
  # =============================================================================
  #
  # SECOND aivis PRODUCER. Emitted by `withdrawals/service.py::_notify_withdrawal`,
  # called from all four staff/system withdrawal-lifecycle functions. Keyed by
  # the withdrawal's CURRENT status, not the audit-event name -- confirm's MVP
  # cascade (confirmed -> processing, immediate) means a withdrawal is never
  # actually left sitting in "confirmed", so PROCESSING is the type a user
  # receives, not "withdrawal.confirmed". Since 2026-10-23 they go to e-mail too and carry no category (the block below says why).

  # E-MAIL FOR MONEY AND DEBT (2026-10-23). The four withdrawal types and
  # the two installment types tranche_overdue and plan_defaulted go to
  # e-mail as well as the cabinet: they touch the person's money or a debt.
  # Every other type stays in the cabinet only. The texts are in
  # templates/<locale>.yaml. A type routed to e-mail carries NO category
  # (checks/comms_profile.py: a category is the mute gate, and nobody may
  # mute the word that their money was sent or that an installment is
  # overdue), so these six no longer carry theirs.

  withdrawal.processing:
    channels: [in_app, email]

  withdrawal.rejected:
    channels: [in_app, email]

  withdrawal.completed:
    channels: [in_app, email]

  withdrawal.failed:
    channels: [in_app, email]

  # =============================================================================
  # aivis product types -- phase 2, batch 3 continued (2026-08-27)
  # =============================================================================
  #
  # THIRD aivis PRODUCER. Emitted by `purchases/service.py::execute_purchase`,
  # once per call, about the SALE purchase. A "gift" allocation on the same
  # purchase (legal_basis == "gift") gets its OWN type, purchase.gift_received,
  # one per gift row -- a purchase_config can carry more than one bonus
  # condition, so a single "you got a bonus" body could not describe an
  # unknown-length list. STILL NOT COVERED, flagged in the emitter's own
  # comment: installments/service.py's pay_tranche() reaches the SAME
  # purchase engine for tranche payments, a distinct product moment (a plan
  # payment, not a purchase confirmation) -- see that emitter's own type,
  # installment.tranche_paid, batch 3 continued below.

  purchase.completed:
    category: purchases

  purchase.gift_received:
    category: purchases

  # =============================================================================
  # aivis product types -- phase 2, batch 3 continued (2026-08-27)
  # =============================================================================
  #
  # FIFTH aivis PRODUCER. Emitted by `installments/service.py::pay_tranche`,
  # the distinct product moment purchase.completed's own comment named as not
  # covered: a plan payment, not a purchase confirmation. Two outcomes, both
  # from the SAME function: `installment.tranche_paid` on success, and
  # `installment.tranche_overdue` on insufficient balance -- the daemon
  # retries an overdue tranche on every scheduled run, so the overdue
  # notification fires only on the FIRST transition into OVERDUE (same guard
  # the existing audit-trail call already used), never on a retry. Plan-level
  # events (complete_plan's completion, default_plan's default) are NOT
  # covered by this delivery -- named here as the next open follow-up, not
  # silently absent.

  installment.tranche_paid:
    category: installments

  installment.tranche_overdue:
    channels: [in_app, email]

  # Plan-level installment events (2026-08-27) -- the follow-up the
  # per-tranche block above named. Both from the same installments module:
  # plan_completed from complete_plan (last tranche paid, or the inline
  # first-tranche path completing a 1-tranche plan), plan_defaulted from
  # default_plan (the daemon defaulting an overdue plan past its grace
  # window). One category with the tranche events -- the whole installment
  # lifecycle mutes together.

  installment.plan_completed:
    category: installments

  installment.plan_defaulted:
    channels: [in_app, email]

  # =============================================================================
  # aivis product types -- phase 2, batch 3 continued (2026-08-27)
  # =============================================================================
  #
  # FOURTH aivis PRODUCER. Emitted by
  # `commissions/worker.py::_distribute_pool`, a scheduled background worker
  # (run_monthly_payout / run_quarterly_payout, called from main.py's lifespan
  # on their own interval, not from an HTTP request) -- the first type in this
  # profile with no request/response cycle behind it. One notification per
  # credited agent per period, written inside the same per-agent loop that
  # writes that agent's VolumePayout row and passive-ledger entries, so a
  # partial-batch failure never leaves a payout without its notification.

  commission.credited:
    category: commissions

  # =============================================================================
  # aivis product types -- batch 6 (2026-08-28), last item of this delivery
  # =============================================================================
  #
  # FOUR NEW PRODUCERS, closing the "notification emitters" backlog item.
  #
  # deposit.confirmed -- run_confirmation_batch() (payments/confirmation.py),
  # a background daemon with no HTTP request behind it (same shape as
  # commission.credited above: no request/response cycle). NEW category
  # `deposits` rather than folding into `withdrawals` or `purchases` --
  # a confirmed deposit is its own money moment (funds became spendable),
  # distinct from what a user spends them on.
  #
  # payment.reversed -- reverse_payment() (payments/reversal.py). Notifies
  # ONLY payment.user_id, the person whose deposit was charged back -- not
  # every id in the function's affected_user_ids set. A chargeback can also
  # claw back downstream agent commission-mirror entries for OTHER users;
  # those recipients get no notification from this delivery. Judgment call
  # (see reversal.py's own comment at the emit site for the full reasoning):
  # matches the withdrawal-notification precedent of one clear recipient,
  # and a multi-recipient clawback notice needs different, non-confusing
  # copy per audience -- a distinct feature, not built here. NEW category
  # `payments` -- a chargeback is the payments domain's own event, not a
  # deposit-lifecycle or withdrawal-lifecycle moment.
  #
  # commission.purchase_credited -- referral.py's per-purchase L1/L2/L3
  # split, written by purchases/engine.py::write_transactions(). DISTINCT
  # from commission.credited above (that one is the periodic volume-bonus
  # payout worker; this one is the immediate per-sale referral commission,
  # a different code path entirely) -- kept as its own type key rather than
  # merged, so a future preference screen can mute the two independently.
  # Shares the EXISTING `commissions` category with commission.credited:
  # both are "an agent got paid" from the recipient's side, and today
  # neither has a reason to mute separately from the other.
  #
  # agent_application.approved / agent_application.rejected --
  # staff_service.py's agent_application_approve() / _reject(). Mirrors the
  # kyc.approved/kyc.rejected shape one level up: one type per outcome
  # (lets a future preference screen mute a rejection differently from an
  # approval), one shared NEW category `agent_applications` -- today there
  # is no reason to let someone mute "you're now an agent" while keeping
  # "your application was rejected", same reasoning as the kyc.* pair.

  deposit.confirmed:
    category: deposits

  payment.reversed:
    category: payments

  commission.purchase_credited:
    category: commissions

  agent_application.approved:
    category: agent_applications

  agent_application.rejected:
    category: agent_applications

  # ===========================================================================
  # EMAIL-BEARING TYPES -- DECLARED WITHOUT A CATEGORY, ON PURPOSE
  # ===========================================================================
  # The four types below are the product's email. They carry NO `category:`
  # line, and that omission is the feature, not an oversight.
  #
  # DO NOT "FIX" THIS BY ADDING A CATEGORY. A type with a category goes
  # through the mute gate: a person can switch that category off in their
  # preferences and stop receiving it. comms' own registry states the rule
  # (app/profile/registry.py, register_type: a type without a category is
  # exempt from mute gating), and every other type in this file WANTS that
  # gate -- a muted "your commission was credited" is a preference.
  #
  # These four are different in kind:
  #
  #   auth.verification_code -- the code that completes registration. Muted,
  #     the account can never be opened.
  #   auth.password_reset -- the link that recovers a lost account. Muted,
  #     a locked-out person has no way back in, and the mute itself is
  #     unreachable because it lives behind the login they cannot pass.
  #   purchase.agreement / ownership.certificate -- the legal documents of a
  #     transaction that already happened. Withholding them on a preference
  #     toggle is not a preference, it is a missing record.
  #
  # So: nobody gets to switch off their own login mail. If a preference
  # screen ever needs to say something about these, the answer is to show
  # them as not mutable, NOT to give them a category and hope no one clicks.
  #
  # NAMING. `ownership.certificate` deliberately does NOT join the
  # `purchase.*` family the agreement sits in: the certificate is keyed by
  # the investor-company pair and aggregates every purchase of that product,
  # while the agreement belongs to exactly one purchase. A key goes into the
  # comms database as data, so it is named after what the document IS rather
  # than after its neighbour in this file.
  #
  # THE CHANNELS ARE DECLARED HERE AND NOWHERE ELSE. A request never names
  # a channel -- comms refuses one that does -- so the emitters in
  # backend/app/modules/auth/service.py and modules/purchases/ send the
  # type alone and this file routes it. The two auth types go to email
  # only; the two documents also land in the in-app inbox. A type that
  # is emitted but NOT declared here is rejected by comms and lands in its
  # dead-letter queue -- that already happened once to kyc.revoked, and a
  # verification revocation reached nobody for as long as it lasted. The
  # reverse (declared here, emitted nowhere) is a dead line in a dictionary
  # someone will later have to prove is dead.
  #
  # THE TWO AUTH TYPES BYPASS THE RECIPIENT'S SCHEDULE; THE DOCUMENTS DO NOT.
  # `recipient_schedule: bypass` skips only the delivery-hours gate (the
  # person's allowed periods) -- not mutes, expiry or retries -- and comms
  # fixes the value at intake. A verification code or a reset link is mail
  # the person has just asked for and is waiting on; held until their quiet
  # hours end, it arrives expired. The two documents keep the default
  # `respect`: they are records of a finished transaction and lose nothing
  # by waiting for the morning.
  #
  # THE SAME TWO TYPES TRAVEL IN THE `interactive` LANE, for the same
  # reason: someone is waiting for them right now. A lane isolates, it does
  # not prioritise -- a backlog in another lane (a mass send, a slow
  # channel) can no longer hold a login code behind it, and nothing else
  # changes: mutes, expiry and retries apply as to any type. The documents
  # stay in the default `normal` lane.

  auth.verification_code:
    channels: [email]
    recipient_schedule: bypass
    lane: interactive

  auth.password_reset:
    channels: [email]
    recipient_schedule: bypass
    lane: interactive

  purchase.agreement:
    channels: [in_app, email]

  ownership.certificate:
    channels: [in_app, email]

  # =============================================================================
  # Support translation -- H39 P-129 (2026-10-25)
  # =============================================================================
  #
  # Support staff read and write ONE language (SUPPORT_LANGUAGE in
  # backend/.env); people write in theirs. A message is translated through
  # comms' llm channel and the result written next to it as a comms
  # VARIANT -- the original is never changed
  # (backend/app/modules/support/translation.py; comms INTEGRATION.md
  # sections 11-12: comms carries the letter to a model and keeps the
  # answer, the backend reads it by key and writes the variant).
  #
  # ONE LLM TYPE PER DIRECTION, one mechanism: the direction is the type.
  #   support.translate_for_support -- a person's message, into the
  #     support language;
  #   support.translate_for_user -- a staff reply, into the person's.
  #
  # `llm_sets: [llm.text]` names a key set of LLM_KEY_SETS in the COMMS
  # .env (/opt/comms/.env). comms REFUSES TO START on a box where that set
  # is not defined -- and with it goes all mail, the login codes included.
  # So the key is on the box BEFORE this profile is rolled out:
  # scripts/install_aivis.sh (deliver_comms_llm) writes it on an install,
  # and an existing box gets it by hand before `aivis update`.
  #
  # `lane: critical`, NOT `interactive` (velo's choice for the same types):
  # comms' rule is that an llm type belongs in a lane with no types for
  # people in it, because a model call holds one of its lane's two places
  # for up to two minutes. Here `interactive` carries the login code and
  # the password reset above -- two translations in work would hold every
  # login code behind them. No type of this file declares `critical`, so
  # the translations have that lane to themselves.
  #
  # `push_on: outcome` -- the backend's listener (core/comms_listener.py)
  # reads the job when it ends. `expires_after: 15m` -- the longest a
  # reader waits before the translation is reported unavailable. No
  # `category`, no `recipient_schedule`: an llm job has no person to gate,
  # and comms refuses both on an llm type.

  support.translate_for_support:
    channels: [llm]
    llm_sets: [llm.text]
    lane: critical
    push_on: outcome
    expires_after: 15m

  support.translate_for_user:
    channels: [llm]
    llm_sets: [llm.text]
    lane: critical
    push_on: outcome
    expires_after: 15m

  # support.translation_unavailable -- a staff reply could not be
  # translated into the person's language (the job ended without an
  # answer, or the model declined). Sent once per (message, language),
  # with the backend's own text (ru or en); the inbox leads it to the
  # support screen by its type.
  #
  # `support_messages`, the category the reply itself pings the person
  # under (msg.participant_message above): a person who muted support
  # replies is not told about a missing one either.
  #
  # IN-APP ONLY, NOT TELEGRAM (owner ruling, H39 gate). comms does not skip
  # a telegram delivery to a person without a telegram_id -- it creates it
  # and fails it as `no_address` (the job ends `partial_sent`), and every
  # such failure is counted against the telegram channel in comms' health
  # report. People who signed up by e-mail -- nearly everyone today -- have
  # no telegram_id, so the channel's health would fill with refusals that
  # say nothing about the bot. Telegram for people comes with the Telegram
  # sign-in (P-133), together with its template sheets.

  support.translation_unavailable:
    category: support_messages

  # =============================================================================
  # Support operator signals (H40 item 8)
  # =============================================================================
  #
  # comms pings an operator on its own (msg.support_message above) only for
  # a thread's assignee or, unassigned, the section roster, and says nothing
  # on a handover (INTEGRATION.md section 14). These three are aivis' own,
  # emitted by backend/app/modules/support/service.py (_emit_signal):
  #
  #   support.message_received -- every message of a person: to the operator
  #     who took the ticket, else to every operator (group support_operators,
  #     written together with the roster by emit_support_membership);
  #   support.ticket_assigned -- a ticket handed to this operator;
  #   support.ticket_released -- a ticket back in the pool: every operator.
  #
  # The staff bell does not show msg.support_message: these cover it and
  # more (frontend, the staff notifications screen, says why).
  #
  # NO CATEGORY: an operator cannot mute support's own signals -- a message
  # nobody hears is a person nobody answers. `recipient_schedule: bypass`
  # for the same reason: they reach the operator at any hour (a mute would
  # still hold; there is none to set).
  #
  # [in_app, telegram] (owner ruling, H40 gate). Telegram renders the
  # sheets in templates/{en,ru}.yaml in the operator's language; the in-app
  # entry shows the stored title and body in SUPPORT_LANGUAGE. The button
  # opens the ticket's card: action_data {action: open_support_ticket,
  # params: {id}} -> startapp=open_support_ticket__<uuid> (57 of 64 chars).
  #
  # EXPECTED NOISE: an operator signed up by e-mail has no telegram_id;
  # comms creates that telegram delivery and fails it as `no_address` (the
  # job ends `partial_sent`), counted against the channel in comms' health
  # report. The in-app entry still arrives. It goes away as operators link
  # Telegram -- which comes with the Telegram sign-in (P-133), not here.

  support.message_received:
    channels: [in_app, telegram]
    recipient_schedule: bypass

  support.ticket_assigned:
    channels: [in_app, telegram]
    recipient_schedule: bypass

  support.ticket_released:
    channels: [in_app, telegram]
    recipient_schedule: bypass
