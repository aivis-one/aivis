# =============================================================================
# AIVIS -- comms product profile: notification type dictionary
# =============================================================================
#
# The comms service carries NO product vocabulary: notification types and
# their preference categories are a per-product artifact living in the
# PRODUCT repo (comms/deploy/INTEGRATION.md section 3). The comms stack
# bind-mounts this directory read-only and reads it at startup.
#
# Format (comms app/profile/loader.py, _parse_types): a MAPPING
# {type_key: {category: str}}, never a list -- a list could not carry
# per-type fields. Unknown spec keys are tolerated (additive contract).
# Widths from comms app/core/constants.py: a type key is <= 50 chars
# (MAX_TYPE_KEY_LEN), a category <= 50 chars (MAX_CATEGORY_LEN).
#
# WHY THE FIRST THREE TYPES EXISTED BEFORE ANY OF THIS PRODUCT'S OWN, AND
# WHY THEY COULD NOT WAIT
# -------------------------------------------------------------------------
# aivis product types (bookings, wallet, verification and the rest of the
# domain dictionary) arrive incrementally, together with the emitters that
# raise them -- declaring a type before its emitter exists would describe
# behaviour that does not. Batch 3 (2026-08-27) is the first delivery: the
# `kyc.*` pair below, emitted from `kyc/service.py::process_webhook`. Read
# its own section for what is specific to it; this section is about the
# three msg.* keys only.
#
# The three msg.* keys are different: they are not aivis types at all. comms
# emits them ITSELF, unconditionally -- chat is a core capability of the
# service, not a feature of the product wired to it. Its loader enforces that in
# _require_msg_type_categories, which runs before templates are even
# parsed: every one of MSG_TYPE_KEYS must be declared here WITH a non-empty
# category, or the profile is rejected and comms does not start. The reason
# is mechanical, not stylistic -- a type with no category bypasses the mute
# gate, so a forgotten category would make chat notifications impossible to
# silence. So the three must be here from the first commit that hands comms
# a profile, phase 2 or no phase 2.
#
# HOW THE CATEGORIES ARE SPLIT: BY ADDRESSEE SIDE, NOT BY THREAD KIND
# -------------------------------------------------------------------
# Established from the bodies of two comms functions in app/notifier.py
# (named without line numbers on purpose -- a function name survives a
# commit in a repository we do not control, a line number does not):
#
#   notify_new_message
#     - emits msg.participant_message to thread.client, and only when the
#       sender is NOT the client -- i.e. the staff side wrote to the person
#       who opened the conversation;
#     - emits msg.support_message to thread.assignee, the operator the
#       thread is assigned to.
#
#   _emit_close_notification
#     - emits msg.thread_closed to thread.client. Its docstring records
#       that only section threads are ever flagged for this notice, so it
#       can only ever mean "the request you opened was closed".
#
# So two of the three land on the person who opened the request and one
# lands on the staff member handling it. Grouping the client-facing pair
# is not a choice between two defensible layouts: they are the same
# conversation with support seen by the same person, and a mute that
# silenced the replies while letting the closing notice through would be a
# defect, not a preference.
#
#   support_messages -- reaches the person who opened the request
#   staff_messages   -- reaches the staff member handling it
#
# THE OTHER PRODUCT'S NAMES WERE DELIBERATELY NOT TAKEN
# -----------------------------------------------------
# velo maps the same three keys onto msg_participants / msg_support. Those
# names describe velo's shape, where a thread can run between two ordinary
# participants. aivis has no participant threads -- every thread is a
# support request between a person and staff -- so a preference toggle
# labelled "participant messages" would name something the user can never
# receive. Copying the names would have cost nothing today and misled every
# reader of the preferences screen from phase 3 onward.
#
# EDITING THIS FILE
# -----------------
# A type key declared TWICE is resolved to the LAST occurrence silently by
# the loader -- no error, no warning -- so a duplicate that carries a
# category passes validation and quietly drifts.
#
# No external domain literals anywhere in this file, comments included.
# The comms startup fence rejects them in the data, but it never sees
# comments (the YAML parser drops them before the check runs), so in the
# comments this rule holds by authorship alone.
# =============================================================================

# -- Reaches the person who opened the support request --

msg.participant_message:
  category: support_messages

msg.thread_closed:
  category: support_messages

# -- Reaches the staff member the request is assigned to --

msg.support_message:
  category: staff_messages

# =============================================================================
# aivis product types -- phase 2, batch 3 (2026-08-27)
# =============================================================================
#
# THE FIRST AIVIS DOMAIN EVENT. Emitted by `kyc/service.py::process_webhook`
# on the ONE existing decision path (there is no separate staff-driven
# approve/reject endpoint today -- measured before writing this section, see
# TASK-REGISTRY.md batch 3). One type per outcome rather than one shared
# `kyc.decision` type: it lets a future preference screen mute a rejection
# notice differently from an approval one, and it matches the msg.* shape
# above (one type = one specific meaning) rather than inventing a new one.
# Both share ONE category so today they mute together; splitting the
# category is free later if that turns out to be wanted.
#
# title/body are sent as literal English strings by the emitter, not through
# a per-locale template in this profile (no templates/ directory exists yet
# in this repo) -- this matches every other backend-authored user-facing
# string today (core/email.py has no locale branching either). Localizing
# outbound notification copy is a real gap, but it is a PRE-EXISTING one
# this batch does not newly create, and it is out of scope for a delivery
# whose job is standing the pipe up, not building backend i18n from zero.

kyc.approved:
  category: kyc

kyc.rejected:
  category: kyc

# =============================================================================
# aivis product types -- phase 2, batch 3 continued (2026-08-27)
# =============================================================================
#
# SECOND aivis PRODUCER. Emitted by `withdrawals/service.py::_notify_withdrawal`,
# called from all four staff/system withdrawal-lifecycle functions. Keyed by
# the withdrawal's CURRENT status, not the audit-event name -- confirm's MVP
# cascade (confirmed -> processing, immediate) means a withdrawal is never
# actually left sitting in "confirmed", so PROCESSING is the type a user
# receives, not "withdrawal.confirmed". One shared category: all four are the
# same real-money lifecycle from the user's side, and a future preference
# screen has no reason yet to let someone mute "your money was sent" while
# keeping "your money didn't go through".

withdrawal.processing:
  category: withdrawals

withdrawal.rejected:
  category: withdrawals

withdrawal.completed:
  category: withdrawals

withdrawal.failed:
  category: withdrawals

# =============================================================================
# aivis product types -- phase 2, batch 3 continued (2026-08-27)
# =============================================================================
#
# THIRD aivis PRODUCER. Emitted by `purchases/service.py::execute_purchase`,
# once per call, about the SALE purchase. A "gift" allocation on the same
# purchase (legal_basis == "gift") gets its OWN type, purchase.gift_received,
# one per gift row -- a purchase_config can carry more than one bonus
# condition, so a single "you got a bonus" body could not describe an
# unknown-length list. STILL NOT COVERED, flagged in the emitter's own
# comment: installments/service.py's pay_tranche() reaches the SAME
# purchase engine for tranche payments, a distinct product moment (a plan
# payment, not a purchase confirmation) -- see that emitter's own type,
# installment.tranche_paid, batch 3 continued below.

purchase.completed:
  category: purchases

purchase.gift_received:
  category: purchases

# =============================================================================
# aivis product types -- phase 2, batch 3 continued (2026-08-27)
# =============================================================================
#
# FIFTH aivis PRODUCER. Emitted by `installments/service.py::pay_tranche`,
# the distinct product moment purchase.completed's own comment named as not
# covered: a plan payment, not a purchase confirmation. Two outcomes, both
# from the SAME function: `installment.tranche_paid` on success, and
# `installment.tranche_overdue` on insufficient balance -- the daemon
# retries an overdue tranche on every scheduled run, so the overdue
# notification fires only on the FIRST transition into OVERDUE (same guard
# the existing audit-trail call already used), never on a retry. Plan-level
# events (complete_plan's completion, default_plan's default) are NOT
# covered by this delivery -- named here as the next open follow-up, not
# silently absent.

installment.tranche_paid:
  category: installments

installment.tranche_overdue:
  category: installments

# Plan-level installment events (2026-08-27) -- the follow-up the
# per-tranche block above named. Both from the same installments module:
# plan_completed from complete_plan (last tranche paid, or the inline
# first-tranche path completing a 1-tranche plan), plan_defaulted from
# default_plan (the daemon defaulting an overdue plan past its grace
# window). One category with the tranche events -- the whole installment
# lifecycle mutes together.

installment.plan_completed:
  category: installments

installment.plan_defaulted:
  category: installments

# =============================================================================
# aivis product types -- phase 2, batch 3 continued (2026-08-27)
# =============================================================================
#
# FOURTH aivis PRODUCER. Emitted by
# `commissions/worker.py::_distribute_pool`, a scheduled background worker
# (run_monthly_payout / run_quarterly_payout, called from main.py's lifespan
# on their own interval, not from an HTTP request) -- the first type in this
# profile with no request/response cycle behind it. One notification per
# credited agent per period, written inside the same per-agent loop that
# writes that agent's VolumePayout row and passive-ledger entries, so a
# partial-batch failure never leaves a payout without its notification.

commission.credited:
  category: commissions

# =============================================================================
# aivis product types -- batch 6 (2026-08-28), last item of this delivery
# =============================================================================
#
# FOUR NEW PRODUCERS, closing the "notification emitters" backlog item.
#
# deposit.confirmed -- run_confirmation_batch() (payments/confirmation.py),
# a background daemon with no HTTP request behind it (same shape as
# commission.credited above: no request/response cycle). NEW category
# `deposits` rather than folding into `withdrawals` or `purchases` --
# a confirmed deposit is its own money moment (funds became spendable),
# distinct from what a user spends them on.
#
# payment.reversed -- reverse_payment() (payments/reversal.py). Notifies
# ONLY payment.user_id, the person whose deposit was charged back -- not
# every id in the function's affected_user_ids set. A chargeback can also
# claw back downstream agent commission-mirror entries for OTHER users;
# those recipients get no notification from this delivery. Judgment call
# (see reversal.py's own comment at the emit site for the full reasoning):
# matches the withdrawal-notification precedent of one clear recipient,
# and a multi-recipient clawback notice needs different, non-confusing
# copy per audience -- a distinct feature, not built here. NEW category
# `payments` -- a chargeback is the payments domain's own event, not a
# deposit-lifecycle or withdrawal-lifecycle moment.
#
# commission.purchase_credited -- referral.py's per-purchase L1/L2/L3
# split, written by purchases/engine.py::write_transactions(). DISTINCT
# from commission.credited above (that one is the periodic volume-bonus
# payout worker; this one is the immediate per-sale referral commission,
# a different code path entirely) -- kept as its own type key rather than
# merged, so a future preference screen can mute the two independently.
# Shares the EXISTING `commissions` category with commission.credited:
# both are "an agent got paid" from the recipient's side, and today
# neither has a reason to mute separately from the other.
#
# agent_application.approved / agent_application.rejected --
# staff_service.py's agent_application_approve() / _reject(). Mirrors the
# kyc.approved/kyc.rejected shape one level up: one type per outcome
# (lets a future preference screen mute a rejection differently from an
# approval), one shared NEW category `agent_applications` -- today there
# is no reason to let someone mute "you're now an agent" while keeping
# "your application was rejected", same reasoning as the kyc.* pair.

deposit.confirmed:
  category: deposits

payment.reversed:
  category: payments

commission.purchase_credited:
  category: commissions

agent_application.approved:
  category: agent_applications

agent_application.rejected:
  category: agent_applications
