# =============================================================================
# AIVIS -- the words of each HTML letter: which layout, and what goes in its slots
# =============================================================================
#
# One entry per type. `layout` names the file <locale>/<layout>.html; the keys
# under `en` and `ru` are that layout's SLOTS (see README.md). A slot text may
# carry data variables in the same {name} form comms renders (the ones the
# backend sends, comms-profile/templates/*.yaml); compose.py fills the slots
# and leaves the variables for comms.
#
# `sent: false` marks a letter whose template exists but which nothing sends
# yet. Those entries also carry `subject` and `text` (the plain alternative).

auth.verification_code:
  layout: code
  en:
    heading: "Verification code"
    lead: "Enter this code to confirm your action in the AIVIS cabinet:"
    code: "{code}"
    valid_note: "The code is valid for {minutes} minutes."
    ignore_note: "If you did not request it, ignore this letter. Never tell the code to anyone."
  ru:
    heading: "Код подтверждения"
    lead: "Введите этот код, чтобы подтвердить действие в кабинете AIVIS:"
    code: "{code}"
    valid_note: "Код действует {minutes} минут."
    ignore_note: "Если вы не запрашивали код, проигнорируйте письмо. Никому не сообщайте этот код."

auth.password_reset:
  layout: action
  en:
    heading: "Reset your password"
    lead: "We received a request to reset your AIVIS password."
    highlight: "The link works once and expires in {minutes} minutes."
    button_text: "Reset password"
    button_url: "{reset_url}"
    note: "If you did not ask for it, ignore this letter: your password stays the same."
  ru:
    heading: "Сброс пароля"
    lead: "Мы получили запрос на сброс вашего пароля AIVIS."
    highlight: "Ссылка работает один раз и действует {minutes} минут."
    button_text: "Сбросить пароль"
    button_url: "{reset_url}"
    note: "Если вы не запрашивали сброс, проигнорируйте письмо: пароль останется прежним."

purchase.agreement:
  layout: document
  en:
    heading: "Your purchase agreement is ready"
    lead: "Dear {investor_name}, the agreement for your purchase is ready. Open it in the cabinet."
    row1_label: "Agreement"
    row1_value: "{agreement_number}"
    row2_label: "Company"
    row2_value: "{company}"
    row3_label: "Product"
    row3_value: "{product}"
    row4_label: "Units"
    row4_value: "{units}"
    row5_label: "Total paid"
    row5_value: "${total_paid}"
    button_text: "Open the agreement"
    button_url: "{documents_url}"
    note: "You will be asked to sign in."
  ru:
    heading: "Ваш договор покупки готов"
    lead: "Здравствуйте, {investor_name}! Договор по вашей покупке готов. Откройте его в кабинете."
    row1_label: "Договор"
    row1_value: "{agreement_number}"
    row2_label: "Компания"
    row2_value: "{company}"
    row3_label: "Продукт"
    row3_value: "{product}"
    row4_label: "Долей"
    row4_value: "{units}"
    row5_label: "Оплачено"
    row5_value: "{total_paid} $"
    button_text: "Открыть договор"
    button_url: "{documents_url}"
    note: "Потребуется вход в кабинет."

ownership.certificate:
  layout: document
  en:
    heading: "Your ownership certificate is ready"
    lead: "Dear {investor_name}, the certificate of your ownership is ready. Open it in the cabinet."
    row1_label: "Company"
    row1_value: "{company}"
    row2_label: "Units owned"
    row2_value: "{total_units}"
    row3_label: "Current value"
    row3_value: "${current_value}"
    row4_label: "As of"
    row4_value: "{as_of}"
    row5_label: "Holder"
    row5_value: "{investor_name}"
    button_text: "Open the certificate"
    button_url: "{documents_url}"
    note: "You will be asked to sign in."
  ru:
    heading: "Ваше свидетельство о владении готово"
    lead: "Здравствуйте, {investor_name}! Свидетельство о вашем владении готово. Откройте его в кабинете."
    row1_label: "Компания"
    row1_value: "{company}"
    row2_label: "Долей во владении"
    row2_value: "{total_units}"
    row3_label: "Текущая стоимость"
    row3_value: "{current_value} $"
    row4_label: "На дату"
    row4_value: "{as_of}"
    row5_label: "Владелец"
    row5_value: "{investor_name}"
    button_text: "Открыть свидетельство"
    button_url: "{documents_url}"
    note: "Потребуется вход в кабинет."

withdrawal.processing:
  layout: notice
  en:
    heading: "Withdrawal approved"
    lead: "Your withdrawal request is approved and is now being processed."
    detail_label: "Amount"
    detail_value: "${amount}"
    status_label: "Status"
    status_text: "Processing"
    status_color: "#B1581B"
    note: "You can follow it in the cabinet."
    button_text: "Open the cabinet"
    button_url: "{cabinet_url}"
  ru:
    heading: "Вывод средств одобрен"
    lead: "Ваш запрос на вывод одобрен и находится в обработке."
    detail_label: "Сумма"
    detail_value: "{amount} $"
    status_label: "Статус"
    status_text: "В обработке"
    status_color: "#B1581B"
    note: "Следить за ним можно в кабинете."
    button_text: "Открыть кабинет"
    button_url: "{cabinet_url}"

withdrawal.completed:
  layout: notice
  en:
    heading: "Withdrawal completed"
    lead: "Your withdrawal request is processed and the funds have been sent."
    detail_label: "Amount"
    detail_value: "${amount}"
    status_label: "Status"
    status_text: "Completed"
    status_color: "#0E6E45"
    note: "The operation is in your cabinet history. If you did not make it, write to us at once."
    button_text: "Open the cabinet"
    button_url: "{cabinet_url}"
  ru:
    heading: "Вывод средств выполнен"
    lead: "Ваш запрос на вывод обработан, средства отправлены."
    detail_label: "Сумма"
    detail_value: "{amount} $"
    status_label: "Статус"
    status_text: "Выполнен"
    status_color: "#0E6E45"
    note: "Операция отражена в истории кабинета. Если вы её не совершали, сразу напишите нам."
    button_text: "Открыть кабинет"
    button_url: "{cabinet_url}"

withdrawal.rejected:
  layout: notice
  en:
    heading: "Withdrawal rejected"
    lead: "Your withdrawal request was rejected. Reason: {reason}"
    detail_label: "Amount"
    detail_value: "${amount}"
    status_label: "Status"
    status_text: "Rejected"
    status_color: "#9C231E"
    note: "The amount has been returned to your balance."
    button_text: "Open the cabinet"
    button_url: "{cabinet_url}"
  ru:
    heading: "Вывод средств отклонён"
    lead: "Ваш запрос на вывод отклонён. Причина: {reason}"
    detail_label: "Сумма"
    detail_value: "{amount} $"
    status_label: "Статус"
    status_text: "Отклонён"
    status_color: "#9C231E"
    note: "Сумма возвращена на ваш баланс."
    button_text: "Открыть кабинет"
    button_url: "{cabinet_url}"

withdrawal.failed:
  layout: notice
  en:
    heading: "Withdrawal could not be completed"
    lead: "Your withdrawal could not be completed."
    detail_label: "Amount"
    detail_value: "${amount}"
    status_label: "Status"
    status_text: "Failed"
    status_color: "#9C231E"
    note: "The amount has been returned to your balance. Questions: write to support."
    button_text: "Open the cabinet"
    button_url: "{cabinet_url}"
  ru:
    heading: "Вывод средств не удалось выполнить"
    lead: "Ваш вывод не удалось выполнить."
    detail_label: "Сумма"
    detail_value: "{amount} $"
