welcome:
  layout: action
  sent: false
  en:
    subject: "Welcome to AIVIS"
    text: |-
      Welcome to AIVIS.

      Your account is ready and your e-mail is confirmed. Open the cabinet
      to complete your profile and see what is available: {cabinet_url}

      If you did not create this account, write to us: {support_url}

      AIVIS.ONE
    heading: "Welcome to AIVIS"
    lead: "Your account is ready. Open the cabinet to complete your profile and see what is available."
    highlight: "Your e-mail is confirmed."
    button_text: "Open the cabinet"
    button_url: "{cabinet_url}"
    note: "If you did not create this account, write to us."
  ru:
    subject: "Добро пожаловать в AIVIS"
    text: |-
      Добро пожаловать в AIVIS.

      Ваш аккаунт создан, почта подтверждена. Откройте кабинет, чтобы
      заполнить профиль и посмотреть, что доступно: {cabinet_url}

      Если вы не создавали этот аккаунт, напишите нам: {support_url}

      AIVIS.ONE
    heading: "Добро пожаловать в AIVIS"
    lead: "Ваш аккаунт создан. Откройте кабинет, чтобы заполнить профиль и посмотреть, что доступно."
    highlight: "Ваша почта подтверждена."
    button_text: "Открыть кабинет"
    button_url: "{cabinet_url}"
    note: "Если вы не создавали этот аккаунт, напишите нам."

installment.reminder:
  layout: action
  sent: false
  en:
    subject: "Installment payment coming up"
    text: |-
      The next tranche of your installment plan is coming up.

      Tranche {tranche_number}: ${amount}, due {due_date}.

      Keep enough balance on the due date, the payment is taken
      automatically: {cabinet_url}

      Questions: {support_url}

      AIVIS.ONE
    heading: "Installment payment coming up"
    lead: "The next tranche of your installment plan is due soon."
    highlight: "Tranche {tranche_number}: ${amount}, due {due_date}"
    button_text: "Open the cabinet"
    button_url: "{cabinet_url}"
    note: "Keep enough balance on the due date, the payment is taken automatically."
  ru:
    subject: "Скоро платёж по рассрочке"
    text: |-
      Скоро срок очередного транша вашей рассрочки.

      Транш {tranche_number}: {amount} $, срок {due_date}.

      Пожалуйста, держите на балансе достаточно средств, списание
      произойдёт автоматически: {cabinet_url}

      Вопросы: {support_url}

      AIVIS.ONE
    heading: "Скоро платёж по рассрочке"
    lead: "Скоро срок очередного транша вашей рассрочки."
    highlight: "Транш {tranche_number}: {amount} $, срок {due_date}"
    button_text: "Открыть кабинет"
    button_url: "{cabinet_url}"
    note: "Держите на балансе достаточно средств, списание произойдёт автоматически."

