    status_text: "Не выполнен"
    status_color: "#9C231E"
    note: "Сумма возвращена на ваш баланс. Вопросы: напишите в поддержку."
    button_text: "Открыть кабинет"
    button_url: "{cabinet_url}"

installment.tranche_overdue:
  layout: notice
  en:
    heading: "Installment payment overdue"
    lead: "The tranche of your installment plan could not be charged because your balance is too low."
    detail_label: "Tranche {tranche_number}"
    detail_value: "${amount}"
    status_label: "Status"
    status_text: "Overdue"
    status_color: "#B1581B"
    note: "Please top up your balance in the cabinet. The payment is retried automatically."
    button_text: "Open the cabinet"
    button_url: "{cabinet_url}"
  ru:
    heading: "Платёж по рассрочке просрочен"
    lead: "Транш вашей рассрочки не удалось списать: на балансе недостаточно средств."
    detail_label: "Транш {tranche_number}"
    detail_value: "{amount} $"
    status_label: "Статус"
    status_text: "Просрочен"
    status_color: "#B1581B"
    note: "Пожалуйста, пополните баланс в кабинете. Списание будет повторено автоматически."
    button_text: "Открыть кабинет"
    button_url: "{cabinet_url}"

installment.plan_defaulted:
  layout: notice
  en:
    heading: "Your installment plan was defaulted"
    lead: "Your installment plan was defaulted after a missed payment. The remaining tranches were cancelled."
    detail_label: "Units from paid tranches"
    detail_value: "Kept"
    status_label: "Status"
    status_text: "Defaulted"
    status_color: "#9C231E"
    note: "Details are in your cabinet."
    button_text: "Open the cabinet"
    button_url: "{cabinet_url}"
  ru:
    heading: "Рассрочка расторгнута"
    lead: "Ваша рассрочка расторгнута из-за пропущенного платежа. Оставшиеся транши отменены."
    detail_label: "Доли по оплаченным траншам"
    detail_value: "Сохранены"
    status_label: "Статус"
    status_text: "Расторгнута"
    status_color: "#9C231E"
    note: "Подробности в кабинете."
    button_text: "Открыть кабинет"
    button_url: "{cabinet_url}"

