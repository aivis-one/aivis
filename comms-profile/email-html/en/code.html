<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><meta name="supported-color-schemes" content="light only"><title>{heading}</title></head>
<body style="margin:0;padding:0;background-color:#FFFFFF;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#FFFFFF" style="background-color:#FFFFFF;"><tr><td align="center" style="padding:0;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:100%;">
<tr><td style="padding:28px 32px 18px 32px;"><img src="{logo_url}" width="150" height="34" alt="AIVIS" style="display:block;border:0;outline:none;text-decoration:none;"></td></tr>
<tr><td style="padding:0 32px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td height="2" bgcolor="#0B4F86" style="height:2px;line-height:2px;font-size:0;background-color:#0B4F86;">&nbsp;</td></tr></table></td></tr>
<tr><td style="padding:28px 32px 32px 32px;"><h1 style="margin:0 0 12px 0;font-family:'Commissioner','Segoe UI',Roboto,Arial,sans-serif;font-size:22px;line-height:28px;font-weight:700;color:#11161B;">{heading}</h1><p style="margin:0 0 20px 0;font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:23px;color:#11161B;">{lead}</p><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td align="center" style="background-color:#EDF1F5;border:1px solid #C5D0DA;border-radius:12px;padding:22px 10px;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:36px;line-height:44px;font-weight:700;letter-spacing:10px;color:#0B4F86;">{code}</td></tr></table><p style="margin:20px 0 8px 0;font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:23px;font-weight:600;color:#11161B;">{valid_note}</p><p style="margin:0;font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:21px;color:#4C5763;">{ignore_note}</p></td></tr>
<tr><td style="padding:0 32px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td height="1" bgcolor="#C5D0DA" style="height:1px;line-height:1px;font-size:0;background-color:#C5D0DA;">&nbsp;</td></tr></table></td></tr>
<tr><td style="padding:18px 32px 28px 32px;"><p style="margin:0 0 4px 0;font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:18px;color:#4C5763;">AIVIS.ONE LLC, Georgia. This is an automatic letter, replies are not read.</p>
<p style="margin:0;font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:18px;color:#4C5763;">Support: <a href="{support_url}" style="color:#0B4F86;text-decoration:underline;">Telegram bot</a> &middot; <a href="mailto:{support_email}" style="color:#0B4F86;text-decoration:underline;">{support_email}</a></p></td></tr>
</table>
</td></tr></table></body></html>
