# =============================================================================
# AIVIS.ONE -- CI
# =============================================================================
#
# WHAT THIS IS FOR. Until now the suite ran only when a human typed
# `aivis test` on a box with Postgres, Redis and storage up. The bar was
# high, so it was cleared rarely, and the cost is known exactly:
# forty-four tests in this tree failed on their FIRST EVER execution --
# not "broke", never ran -- and unpicking them turned up two live holes
# in the product. This file exists so that no test can be delivered
# without having been run.
#
# WHY ONE FILE AND TWO JOBS. Two jobs give two independent statuses, so
# a red frontend does not hide a green backend. One file keeps the whole
# mechanism readable in one place.
#
# WHY NO `paths:` FILTERS. They would save the ~2 minutes of `npm ci` on
# a Python-only push, and they would buy it with a job that can silently
# not run: a filtered required check sits in "expected" forever, and a
# change to something shared (scripts/generate_ts_types.py) can miss
# every filter. A mechanism able to not fire by configuration is the
# exact class this project keeps paying for. The two minutes are the
# price of the guarantee, and they are named here rather than saved
# quietly.
#
# WHY EVERY PRECONDITION IS ITS OWN STEP. Because the reader has to know
# WHICH thing broke from the step name, without opening the log. A
# single "prepare" step that migrates, seeds and uploads would report
# "prepare failed" for six different situations. The seam check below is
# the sharpest case: without the template objects the suite falls over
# anyway -- on 2026-09-01 it was twenty-nine failures -- and the
# difference is one line naming the count versus twenty-nine
# StorageError tracebacks.
#
# WHAT IS NOT HERE, DELIBERATELY:
#   ruff / mypy -- `ruff check .` is 467 errors on this tree today and
#     mypy strict is 110 in 37 files. A step that is always red gets
#     filtered out within a week, and it takes the red pytest next to it
#     along. Recorded as debt with the per-area counts, together with
#     the finding that even the narrow rule set needs reading before
#     fixing: four of its seven hits are `company_user = await
#     _load_user(...)`, where the variable is unused but the CALL raises
#     on a missing user, so `--fix` would delete a live check in two
#     money paths.
#   `npm audit` in the blocking path -- it goes red when somebody else
#     publishes an advisory, not when we push. Same failure mode as an
#     always-red linter, so it runs as its own non-blocking job below.
#
# THE SOURCE THIS REPRODUCES is scripts/aivis-manage.sh, prepare_test_db
# and the object checks it calls (check_platform_template_objects), plus
# the `storage` and `storage-init` services of docker-compose.yml. Where
# this file and those disagree, they are right and this file is wrong --
# which is why the storage images are READ from docker-compose.yml below
# rather than copied here.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs: used to demonstrate that this file can go red without
  # pushing a deliberately broken commit.
  workflow_dispatch:

# Ten pushes in a row should not queue ten full runs. Only the newest
# commit on a ref is worth checking; the older ones are already history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Backend
  # ===========================================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aivis
          POSTGRES_PASSWORD: aivis
          POSTGRES_DB: aivis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aivis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      SECRET_KEY: ci-secret-key-not-used-outside-this-runner
      # ONE literal, read by alembic, both seeds, the smoke checks and
      # pytest. Written twice it would drift, and the run would migrate
      # one database while testing another.
      DATABASE_URL: postgresql+asyncpg://aivis:aivis@127.0.0.1:5432/aivis_test
      REDIS_URL: redis://127.0.0.1:6379/0
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      # Root credentials, and this is the one place CI differs from
      # compose on purpose: compose mints a service account for the
      # backend so that the root key never reaches the application. That
      # boundary protects a long-lived stand. This container lives for
      # one job and is destroyed with the runner, so the account it would
      # protect does not outlast the thing it protects against.
      #
      # The root pair is set ONLY here, never in docker-compose.yml's
      # `environment` (the box takes it from backend/.env.storage, which
      # CI does not have). The resolve step below refuses a compose file
      # that starts naming it, so the two can never both be set.
      STORAGE_ACCESS_KEY: ci-storage-root
      STORAGE_SECRET_KEY: ci-storage-root-secret
      RUSTFS_ACCESS_KEY: ci-storage-root
      RUSTFS_SECRET_KEY: ci-storage-root-secret
      STORAGE_BUCKET: aivis-attachments
      # COMMS_API_URL is deliberately UNSET. A box without comms is a
      # supported configuration (backend/app/core/config.py judges
      # COMMS_API_URL with required=False), and
      # since the three tests that used to read this variable now pin
      # their own state, the suite is green either way. Setting it here
      # would make CI depend on a second product being reachable.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pycairo builds against these; the runtime image installs
      # libcairo2 and the builder stage libcairo2-dev (backend/Dockerfile
      # :29-33). A runner has neither.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      # DEPENDENCIES ONLY, FROM AN EMPTY DIRECTORY, and the emptiness is
      # the point. `pip install ".[dev]"` from the repository root fails:
      # setuptools finds two top-level packages (`app` and `migrations`)
      # and refuses to guess. The image gets away with it because
      # backend/Dockerfile:35 copies pyproject.toml ALONE into an
      # otherwise empty WORKDIR, so there is nothing to discover. This
      # reproduces that condition deliberately instead of relying on the
      # accident. The real fix -- declaring the packages in pyproject --
      # is recorded as debt.
      - name: Install Python dependencies
        run: |
          mkdir -p /tmp/deps
          cp backend/pyproject.toml /tmp/deps/
          python -m pip install --upgrade pip
          pip install "/tmp/deps[dev]"

      # Fail here, loudly, rather than three steps later with a
      # connection error or a pytest UsageError. The second assertion is
      # the pair to the first: a variable being set is not the same as it
      # pointing somewhere safe, and tests/conftest.py (its
      # `endswith("_test")` guard) refuses to run
      # against a database whose name does not end in `_test`.
      - name: Check required environment
        run: |
          set -euo pipefail
          for var in APP_ENV SECRET_KEY DATABASE_URL REDIS_URL \
                     STORAGE_ENDPOINT STORAGE_ACCESS_KEY STORAGE_SECRET_KEY \
                     STORAGE_BUCKET RUSTFS_ACCESS_KEY RUSTFS_SECRET_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is unset or empty"
              exit 1
            fi
          done
          case "$DATABASE_URL" in
            *_test) echo "DATABASE_URL targets a test database" ;;
            *) echo "::error::DATABASE_URL must end with _test"; exit 1 ;;
          esac

      # ONE COPY OF THE STORAGE PINS, and it is docker-compose.yml. CI used
      # to carry its own copy of the image tags "pinned to what compose
      # pins"; the box moved to RustFS, the copy stayed on the previous
      # store, and CI went on testing a store the product no longer runs
      # on until the
      # copied images were deleted upstream and every run went red (P-119).
      # So the images, the server's `environment` and its data mount are
      # READ from the `storage` and `storage-init` services here, by
      # service name.
      #
      # PyYAML, not `docker compose config`: the latter refuses to render
      # without backend/.env.storage, which CI does not have and must not
      # fake. Not `yq` either: the runner ships one yq and the stand
      # another, with different syntax and output. PyYAML is already
      # installed above from pyproject.toml.
      #
      # Refuses, naming the field, on: no compose file, a missing service,
      # an image that is empty or not pinned by digest, an `environment`
      # that is empty, carries the root key pair (that is set by this job
      # alone), holds an unset or `${...}` value CI cannot reproduce, or a
      # data mount that is not exactly one.
      - name: Resolve storage images from docker-compose.yml
        run: |
          python - <<'PY'
          import os
          import sys

          import yaml

          COMPOSE = "docker-compose.yml"
          ROOT_KEYS = {"RUSTFS_ACCESS_KEY", "RUSTFS_SECRET_KEY"}


          def fail(msg):
              print(f"::error::{COMPOSE}: {msg}")
              sys.exit(1)


          try:
              with open(COMPOSE) as fh:
                  doc = yaml.safe_load(fh)
          except FileNotFoundError:
              fail("file not found")

          services = doc.get("services") if isinstance(doc, dict) else None
          if not isinstance(services, dict):
              fail("no `services` mapping")


          def service(name):
              svc = services.get(name)
              if not isinstance(svc, dict):
                  fail(f"service '{name}' is missing")
              return svc


          def image(name):
              ref = service(name).get("image")
              if not isinstance(ref, str) or not ref.strip():
                  fail(f"service '{name}' has no image")
              ref = ref.strip()
              if "@sha256:" not in ref:
                  fail(f"service '{name}' image '{ref}' is not pinned by digest")
              return ref


          def scalar(key, value):
              # Compose accepts strings, numbers and booleans; a null means
              # "take it from the host shell", which CI cannot reproduce.
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, (int, float)):
                  return str(value)
              if not isinstance(value, str):
                  fail(f"service 'storage' environment {key} has no value")
              if "$" in value or "\n" in value:
                  fail(f"service 'storage' environment {key} needs interpolation")
              return value


          storage = service("storage")
          raw_env = storage.get("environment")
          if isinstance(raw_env, list):
              pairs = {}
              for item in raw_env:
                  key, sep, value = str(item).partition("=")
                  pairs[key] = value if sep else None
              raw_env = pairs
          if not isinstance(raw_env, dict) or not raw_env:
              fail("service 'storage' has no environment")
          clash = sorted(ROOT_KEYS & set(raw_env))
          if clash:
              fail(f"service 'storage' environment sets {', '.join(clash)}; "
                   "the root key pair comes from the CI job only")
          env_lines = [f"{key}={scalar(key, value)}" for key, value in raw_env.items()]

          mounts = storage.get("volumes") or []
          if len(mounts) != 1:
              fail(f"service 'storage' has {len(mounts)} volumes, expected exactly 1")
          mount = mounts[0]
          if isinstance(mount, dict):
              target = mount.get("target")
          else:
              parts = str(mount).split(":")
              target = parts[1] if len(parts) >= 2 else None
          if not isinstance(target, str) or not target.startswith("/"):
              fail(f"service 'storage' volume '{mount}' has no absolute target")

          storage_image = image("storage")
          rc_image = image("storage-init")

          env_file = os.path.join(os.environ["RUNNER_TEMP"], "storage.env")
          with open(env_file, "w") as fh:
              fh.write("\n".join(env_lines) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"STORAGE_IMAGE={storage_image}\n")
              fh.write(f"RC_IMAGE={rc_image}\n")
              fh.write(f"STORAGE_ENV_FILE={env_file}\n")
              fh.write(f"STORAGE_DATA_DIR={target}\n")
          print(f"storage:      {storage_image}")
          print(f"storage-init: {rc_image}")
          print(f"environment:  {', '.join(sorted(raw_env))}")
          print(f"data mount:   {target}")
          PY

      # Not a service container: a service's image is fixed when the job
      # is parsed, before any step runs, so it cannot take the image the
      # step above reads from compose. `docker run` can.
      #
      # REMOVE BEFORE START, container and volume both: a re-run on a
      # self-hosted runner would otherwise find the previous run's
      # container holding port 9000, or its volume holding objects --
      # the same inherited-state trap the test database is dropped for.
      # The named volume mirrors compose, which mounts one at the same
      # path; the image's own directory is not assumed writable.
      - name: Start storage
        run: |
          docker rm -f storage >/dev/null 2>&1 || true
          docker volume rm -f aivis-ci-storage-data >/dev/null 2>&1 || true
          docker run -d --name storage -p 127.0.0.1:9000:9000 \
            --env-file "$STORAGE_ENV_FILE" \
            -e RUSTFS_ACCESS_KEY \
            -e RUSTFS_SECRET_KEY \
            -v "aivis-ci-storage-data:$STORAGE_DATA_DIR" \
            "$STORAGE_IMAGE"

      # The endpoint compose's healthcheck polls. Sixty seconds, not
      # thirty: compose itself grants the server a 15s start period
      # before it even begins counting failures.
      - name: Wait for storage
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health >/dev/null; then
              echo "Storage ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::storage did not become ready in 60s"
          docker logs storage || true
          exit 1

      # The same client, the same image and the same commands as the
      # `storage-init` service in docker-compose.yml. Creating the buckets
      # with boto3 instead would be a second implementation of something
      # the stand already does, and the two would drift the first time
      # either changed. HOME=/tmp for the reason storage-init gives: rc
      # keeps its alias file under $HOME, and the image's may not be
      # writable. Keys go in through the environment, never spliced into
      # the script text.
      #
      # BOTH buckets, and the test one matters as much: the seam check
      # below reads only the MAIN bucket by design, so a missing
      # aivis-attachments-test would sail past it and surface as
      # seventeen storage failures in the middle of pytest.
      - name: Create buckets
        run: |
          docker run --rm --network host \
            -e RUSTFS_ACCESS_KEY -e RUSTFS_SECRET_KEY \
            --entrypoint /bin/sh "$RC_IMAGE" -c '
              set -e
              export HOME=/tmp
              rc alias set local http://127.0.0.1:9000 \
                "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY"
              rc mb -p local/aivis-attachments
              rc mb -p local/aivis-attachments-test
              rc anonymous set private local/aivis-attachments
              rc anonymous set private local/aivis-attachments-test
            '

      # "Created" and "readable by the account the backend will use" are
      # different claims, and only the second one matters. This checks
      # the second, with the very credentials handed to the application
      # above. Here they equal the root pair (see the job env); the check
      # still reads them from STORAGE_*, so it keeps meaning the right
      # thing if the two ever part.
      - name: Verify buckets are readable by the backend's credentials
        run: |
          docker run --rm --network host \
            -e STORAGE_ACCESS_KEY -e STORAGE_SECRET_KEY \
            --entrypoint /bin/sh "$RC_IMAGE" -c '
              set -e
              export HOME=/tmp
              rc alias set backend http://127.0.0.1:9000 \
                "$STORAGE_ACCESS_KEY" "$STORAGE_SECRET_KEY"
              rc ls backend/aivis-attachments
              rc ls backend/aivis-attachments-test
            '

      # STEP ONE OF THE BOX'S SEQUENCE, and its absence is what broke
      # the first run of this file: the service container creates
      # `aivis`, the suite runs against `aivis_test`, and nothing in
      # between was creating it. aivis-manage.sh does this in
      # prepare_test_db and I reproduced the six steps after it while dropping the one
      # my own stand had done by hand.
      #
      # DROP ... WITH (FORCE) as well as CREATE, even though a runner
      # starts empty: a `workflow_dispatch` re-run on a self-hosted
      # runner would find the previous run's database, and a suite that
      # inherits state is the thing the box drops it to avoid.
      - name: Create the test database
        run: |
          PGPASSWORD=aivis psql -h 127.0.0.1 -U aivis -d postgres \
            -c "DROP DATABASE IF EXISTS aivis_test WITH (FORCE);" \
            -c "CREATE DATABASE aivis_test OWNER aivis;"

      # Schema from the migration files, never metadata.create_all --
      # the latter misses the functional indexes that only exist inside
      # migrations (aivis-manage.sh says the same at greater length).
      - name: Migrate
        working-directory: backend
        run: python -m alembic upgrade head

      # Two steps, not one, so the step name says which seed failed.
      - name: Seed platform user
        working-directory: backend
        run: python scripts/seed_platform.py

      - name: Seed platform templates
        working-directory: backend
        run: python -m scripts.seed_platform_templates

      - name: Smoke check -- 16 platform template rows
        run: |
          count=$(PGPASSWORD=aivis psql -h 127.0.0.1 -U aivis -d aivis_test -tAc \
            "SELECT COUNT(*) FROM company_document_templates
             WHERE company_id IS NULL AND status='active';" | tr -d '[:space:]')
          if [ "$count" != "16" ]; then
            echo "::error::expected 16 active platform templates, found '$count'"
            exit 1
          fi
          echo "16 platform template rows present"

      - name: Upload platform template objects
        working-directory: backend
        run: python -m scripts.platform_template_objects upload

      # THE OTHER HALF OF THE SEAM, and it fails HERE rather than inside
      # pytest on purpose. Rows in the database and objects in storage
      # are two sides of one thing, and checking one side once passed
      # green while the other was empty: the product answered NoSuchKey
      # on every agreement and the smoke check said fine.
      - name: Smoke check -- 64 platform template objects
        working-directory: backend
        run: python -m scripts.platform_template_objects check

      - name: Run the suite
        working-directory: backend
        run: python -m pytest tests/ -q

      # Covers what `npm run build` and `pytest` cannot: the Dockerfile
      # itself, .dockerignore, and the system packages installed in the
      # image. A broken Dockerfile otherwise surfaces during an
      # installation at a customer's, which is the most expensive place
      # to find it -- scripts/install_aivis.sh builds exactly this.
      - name: Build the backend image
        run: docker build -f backend/Dockerfile backend

  # ===========================================================================
  # Frontend
  # ===========================================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    # THE ADDRESSES THIS BUILD IS FOR (H35 P-127). The frontend has no
    # default address: it is built for the API and files origins it is
    # given, which on a server come from the installer's answers. CI builds
    # for reserved domains (RFC 2606), so every run proves the product is
    # not tied to the domain it is deployed on: the bundle and the rendered
    # nginx.conf are scanned below for the production domain and must carry
    # these origins instead.
    env:
      AIVIS_API_ORIGIN: https://api.example.com
      AIVIS_FILES_ORIGIN: https://files.example.com

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: it fails when package.json and the
      # lockfile disagree instead of quietly resolving something else.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # stdlib-only, runs anywhere. Every check in checks/ (run.py runs
      # them all): the router table, design tokens, breakpoints, shell
      # layout, pre-auth widths, ref-truth guards, nginx headers, the
      # comms profile and deployment addresses -- none of which any of the
      # steps below can see.
      # Not counted here on purpose: a count in a comment is the first
      # thing to go stale when a check is added.
      - name: Static checks
        run: python3 checks/run.py

      # Separate from the build even though `npm run build` runs vue-tsc
      # itself. The duplication is what splits two different reds: types
      # wrong, or bundling wrong. H10 hit the first one twice in a row
      # and the message came out of a Docker build log.
      - name: Type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      # The vitest tests that live in this tree and had no automatic
      # runner (uncounted for the same reason as the checks above). A CI
      # that skipped them would repeat, on a smaller scale, exactly the
      # thing this file is here to stop.
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.AIVIS_API_ORIGIN }}
        run: npm run build

      - name: No deployment address in the bundle
        run: python3 checks/deploy_addresses.py --built frontend/dist --expect "$AIVIS_API_ORIGIN"

      # The image is what ships, so it is checked from the inside: the
      # bundle it serves and the nginx config rendered from the template.
      # Both must name the example.com origins and nothing of the
      # production domain.
      - name: Build the frontend image
        run: |
          docker build -f frontend/Dockerfile frontend -t aivis-frontend:ci \
            --build-arg AIVIS_API_ORIGIN --build-arg AIVIS_FILES_ORIGIN

      - name: No deployment address in the image
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/image"
          rm -rf "$out" && mkdir -p "$out"
          id=$(docker create aivis-frontend:ci)
          docker cp "$id:/usr/share/nginx/html/app" "$out/app"
          docker cp "$id:/etc/nginx/conf.d/default.conf" "$out/default.conf"
          docker rm "$id" > /dev/null
          python3 checks/deploy_addresses.py --built "$out/app" --expect "$AIVIS_API_ORIGIN"
          python3 checks/deploy_addresses.py --built "$out/default.conf" \
            --expect "$AIVIS_API_ORIGIN" --expect "$AIVIS_FILES_ORIGIN"

  # ===========================================================================
  # Dependency audit -- reports, never blocks
  # ===========================================================================
  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # NON-BLOCKING BY DESIGN. This job goes red when somebody publishes
    # an advisory against a transitive dependency -- an event with no
    # relation to the commit being checked. A blocking step of that kind
    # is red on mornings when nothing is wrong, and a check that cries
    # wolf gets filtered out along with the checks that do not. The news
    # is worth having; the veto is not.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit
        working-directory: frontend
        run: npm audit --audit-level=high
