# =============================================================================
# CBSHOME -- Docker Compose
# =============================================================================
#
# Full stack: app + frontend + postgres + redis + minio
#
# Usage:
#   cbshome update   -- pull, build, migrate, test, restart
#   cbshome test     -- run tests inside container
#   cbshome status   -- health check
#
# Note: lives in repo root -- manages both backend/ and frontend/ contexts.
# =============================================================================

services:
  app:
    build: ./backend
    container_name: cbshome-app
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    # Legal documents are authored in the frontend repo and consumed by
    # seed_documents.py inside this container. Read-only bind mount.
    volumes:
      - ./frontend/public/legal:/legal:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cbshome-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      app: { condition: service_healthy }
    # nginx listens on 0.0.0.0:3000 (IPv4 only). `localhost` inside the
    # container resolves AAAA first on some distros and the IPv6 probe
    # fails with "connection refused" -- use an explicit 127.0.0.1 so
    # the check never flips to unhealthy when nginx is actually serving.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: cbshome-postgres
    env_file:
      - ./backend/.env
    volumes:
      - cbshome_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbshome -d cbshome"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # No published ports -- internal network only (security)

  redis:
    image: redis:7-alpine
    container_name: cbshome-redis
    env_file:
      - ./backend/.env
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - cbshome_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$REDIS_PASSWORD; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # No published ports -- internal network only (security)

  # ---------------------------------------------------------------------------
  # MinIO -- S3-compatible object storage for company attachments and templates.
  #
  # IMAGE SOURCE: cgr.dev/chainguard/minio
  #   On 23 Oct 2025 the upstream MinIO project stopped publishing the
  #   community Docker image. The last published image carries known
  #   CVE GHSA-jjjj-jwhf-8rgr (privilege escalation via session policy
  #   bypass), patched only in source release RELEASE.2025-10-15T17-29-55Z
  #   for which no upstream image exists. Chainguard rebuilds MinIO
  #   from source against their secure base, ships zero-CVE images, and
  #   the binary inside is fully drop-in compatible with the community
  #   minio: same `server` subcommand, same flags, same env vars, same
  #   /minio/health/live endpoint, same S3 protocol on the wire.
  #   Reference:
  #   https://edu.chainguard.dev/chainguard/chainguard-images/getting-started/minio/
  #
  # PORTS:
  #   9000 -- S3 API. Backend talks to it through docker network as
  #           http://minio:9000; never exposed beyond the host.
  #   9001 -- Web UI / Object Browser. Reachable from outside ONLY via
  #           nginx reverse proxy at https://storage-mc-admin.cbshome.org
  #           with basic-auth (configured in install_cbshome.sh).
  #
  # HEALTHCHECK:
  #   CMD form (not CMD-SHELL) -- Chainguard production images don't
  #   bundle a shell. curl IS bundled; the official Chainguard MinIO
  #   guide uses exactly this probe.
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cbshome-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - ./backend/.env
    volumes:
      - cbshome_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO init -- one-shot bootstrap of buckets, anonymous policy, and
  # backend service account. Idempotent: reruns on every `docker compose up`
  # do not break anything; existing buckets / svcacct are detected and skipped.
  #
  # `restart: "no"` -- this container exits 0 after init and stays stopped.
  # `docker compose up -d` will not flag it as unhealthy because it has no
  # healthcheck and no restart policy.
  #
  # IMAGE SOURCE: pinned upstream community release.
  #   We deliberately do NOT use cgr.dev/chainguard/minio-client here:
  #   its production variant has a hard-coded ENTRYPOINT=/usr/bin/mc
  #   and ships no shell, so the multi-line bootstrap script below
  #   cannot run. The dev variant ships a shell but is explicitly
  #   marked "not for production" in Chainguard's BEST_PRACTICES.md.
  #
  #   Pin to RELEASE.2025-08-13T08-35-41Z (last community release on
  #   Docker Hub before MinIO archived). Acceptable trade-off: this is
  #   a CLIENT tool with no attack surface, runs once at compose-up
  #   over the internal docker network, and speaks S3 admin API to our
  #   Chainguard-built server which is forward-compatible with older
  #   mc clients.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: cbshome-minio-init
    depends_on:
      minio: { condition: service_healthy }
    env_file:
      - ./backend/.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        # Configure mc alias inside the container -- talks to minio service
        # over the docker network (not 127.0.0.1).
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

        # Create main bucket (production attachments + templates) and test
        # bucket (used by backend integration tests). `mb -p` is idempotent.
        mc mb -p local/cbshome-attachments
        mc mb -p local/cbshome-attachments-test

        # Force private (no anonymous access). Even if a previous run set
        # a different policy, this resets it.
        mc anonymous set none local/cbshome-attachments
        mc anonymous set none local/cbshome-attachments-test

        # Backend service account (one for both buckets). Idempotent: list
        # existing svcaccts for root user and skip creation if our access
        # key is already there. `grep -qxF` matches the literal access key
        # as a whole line -- a substring grep would mis-detect "cbshome"
        # against an unrelated "cbshome-test" key.
        if mc admin user svcacct ls local "$$MINIO_ROOT_USER" 2>/dev/null | grep -qxF "$$MINIO_ACCESS_KEY"; then
          echo "Service account $$MINIO_ACCESS_KEY already exists, skipping"
        else
          mc admin user svcacct add local "$$MINIO_ROOT_USER" \
            --access-key "$$MINIO_ACCESS_KEY" \
            --secret-key "$$MINIO_SECRET_KEY"
          echo "Service account $$MINIO_ACCESS_KEY created"
        fi

        echo "MinIO init completed"
    restart: "no"

volumes:
  cbshome_postgres_data:
  cbshome_redis_data:
  cbshome_minio_data:
