name: aivis
# The compose PROJECT name, declared rather than inferred.
#
# Unset, compose derives it from the directory holding this file, which is an
# accident of the checkout layout: two stacks whose files both sit in `deploy/`
# resolve to ONE project, and one whose file sits in a repository root becomes
# `repo`. Same project means one label namespace -- `ps` from either directory
# lists the other's containers, every `up -d` reports the other's as orphans,
# and `down --remove-orphans` from either destroys the other.
#
# CONVENTION for every service on these servers: declare it here, first line,
# equal to the service name. A stack that does not is one directory rename away
# from colliding with a stack it has never heard of.
#
# Nothing observes this except a live docker daemon, so no test covers it.

# =============================================================================
# AIVIS.ONE -- Docker Compose
# =============================================================================
#
# Full stack: app + frontend + postgres + redis + storage (RustFS)
#
# Usage:
#   aivis update   -- pull, build, migrate, test, restart
#   aivis test     -- run tests inside container
#   aivis status   -- health check
#
#
# ENV FILES -- `app` is the only service that reads backend/.env. postgres,
# redis, storage and storage-init read NARROW PROJECTIONS of it
# (backend/.env.db, backend/.env.storage), generated by
# scripts/env-render.sh on every install and every update. A compromised
# datastore or object store therefore no longer holds the application's
# payment, telegram, session and comms-service secrets.
#
# Both projections are GENERATED and gitignored: compose refuses to run
# at all when an env_file is missing, so `aivis update` regenerates them
# before it touches the stack.
#
# Note: lives in repo root -- manages both backend/ and frontend/ contexts.
# =============================================================================

services:
  app:
    build: ./backend
    container_name: aivis-app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    # Legal documents are authored in the frontend repo and consumed by
    # seed_documents.py inside this container. Read-only bind mount.
    volumes:
      - ./frontend/public/legal:/legal:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # The backend is the ONLY aivis service that talks to comms (the comms
    # API is internal -- no published port, no nginx route -- and resolves
    # by service name on aivis-shared only).
    # `default` is listed explicitly: the moment a service carries a
    # `networks:` key, compose stops attaching it to the default network
    # implicitly, and app would lose postgres / redis / storage.
    networks:
      - default        # intra-aivis traffic, unchanged
      - aivis-shared   # reach comms-app / comms-redis by name

  frontend:
    # The image carries this server's addresses, fixed at build time: the
    # API origin the cabinet calls and the API and files origins its CSP
    # allows (frontend/Dockerfile says how). They come from the environment
    # `aivis frontend build` / `aivis update` set (build_frontend_image in
    # scripts/aivis-manage.sh). `:-` and not `:?` on purpose: compose
    # interpolates the whole file for EVERY command, so `:?` would make
    # `docker compose ps` / `exec app` refuse to run on a shell without
    # them. The empty value is no address -- frontend/Dockerfile stops the
    # build on it with the variable's name.
    build:
      context: ./frontend
      args:
        AIVIS_API_ORIGIN: ${AIVIS_API_ORIGIN:-}
        AIVIS_FILES_ORIGIN: ${AIVIS_FILES_ORIGIN:-}
    container_name: aivis-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      app: { condition: service_healthy }
    # nginx listens on 0.0.0.0:3000 (IPv4 only). `localhost` inside the
    # container resolves AAAA first on some distros and the IPv6 probe
    # fails with "connection refused" -- use an explicit 127.0.0.1 so
    # the check never flips to unhealthy when nginx is actually serving.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: aivis-postgres
    env_file:
      - ./backend/.env.db
    volumes:
      - aivis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivis -d aivis"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # No published ports -- internal network only (security)

  redis:
    image: redis:7-alpine
    container_name: aivis-redis
    env_file:
      - ./backend/.env.db
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - aivis_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$REDIS_PASSWORD; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # No published ports -- internal network only (security)

  # ---------------------------------------------------------------------------
  # Object storage -- RustFS, S3-compatible, for company attachments, KYC
  # documents, roadmap covers and document templates (H32 P-120).
  #
  # WHY RUSTFS. MinIO is frozen by its developer: no free builds since
  # October 2025, its images are gone from Docker Hub and dl.min.io answers
  # 410. Documents of people must sit in storage that still receives
  # security fixes.
  #
  # IMAGE PIN: tag AND digest. The tag says which release this is; the
  # digest makes `docker compose pull` unable to move us, even if the tag
  # is re-pushed. Changing the version means changing both, together.
  #
  # PORTS: only the S3 API, only on the host loopback. Backend talks to it
  #   through the docker network as http://storage:9000. The host nginx
  #   site (files.<domain>) proxies 127.0.0.1:9000 with the Host header
  #   unchanged, so the SigV4 links the backend signs for that host verify
  #   (core/storage.py). The web console is OFF (RUSTFS_CONSOLE_ENABLE) and
  #   its port is not published: there is no console on this box.
  #
  # Healthcheck: GET /health; the image is alpine-based and ships curl.
  # ---------------------------------------------------------------------------
  storage:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    container_name: aivis-storage
    ports:
      - "127.0.0.1:9000:9000"
    env_file:
      - ./backend/.env.storage
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - aivis_storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Storage init -- one-shot bootstrap of both buckets (private) and the
  # backend's own key. Idempotent: every `docker compose up` reruns it, and
  # an existing bucket or key is detected and left alone.
  #
  # Uses rc, RustFS's command-line client (github.com/rustfs/cli), the
  # replacement for mc. Pinned by tag and digest like the server. Also
  # the image `aivis storage stats` and `aivis backup` run rc from
  # (scripts/aivis-manage.sh, storage_rc) -- nothing is installed on the
  # host.
  #
  # `restart: "no"` -- the container exits 0 after init and stays stopped;
  # `aivis update` inspects that exit code.
  # ---------------------------------------------------------------------------
  storage-init:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    container_name: aivis-storage-init
    depends_on:
      storage: { condition: service_healthy }
    env_file:
      - ./backend/.env.storage
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # rc keeps its alias file under $$HOME; the image runs as a user
        # whose home may not be writable, so give it a scratch one.
        export HOME=/tmp

        # REFUSE ON EMPTY CREDENTIALS, BEFORE CREATING ANYTHING. A key
        # created from empty values would not be the key the backend holds.
        if [ -z "$$RUSTFS_ACCESS_KEY" ] || [ -z "$$RUSTFS_SECRET_KEY" ] \
           || [ -z "$$STORAGE_ACCESS_KEY" ] || [ -z "$$STORAGE_SECRET_KEY" ]; then
          echo "Root or backend storage keys are empty in .env.storage."
          echo "Fix RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY /"
          echo "STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY in backend/.env."
          exit 1
        fi

        rc alias set local http://storage:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"

        # Production bucket and the test bucket. -p: an existing bucket is
        # not an error (without it rc exits non-zero on "already exists").
        rc mb -p local/aivis-attachments
        rc mb -p local/aivis-attachments-test

        # Private, stated rather than assumed. A new RustFS bucket is
        # private already; this also resets one somebody opened by hand.
        rc anonymous set private local/aivis-attachments
        rc anonymous set private local/aivis-attachments-test

        # The backend's key: a service account of the root user, limited
        # by its own policy to the two buckets -- objects in, objects out,
        # list. It cannot create buckets, touch other buckets, or change
        # bucket policy (all three checked against RustFS 1.0.1, H32 stand).
        cat > /tmp/aivis-backend-policy.json <<'POLICY'
        {"Version": "2012-10-17", "Statement": [{"Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject",
                     "s3:ListBucket", "s3:GetBucketLocation"],
          "Resource": ["arn:aws:s3:::aivis-attachments",
                       "arn:aws:s3:::aivis-attachments/*",
                       "arn:aws:s3:::aivis-attachments-test",
                       "arn:aws:s3:::aivis-attachments-test/*"]}]}
        POLICY

        # Existing key -> left exactly as it is: creating it again fails
        # with "access key is already in use".
        if rc admin service-account info local "$$STORAGE_ACCESS_KEY" > /dev/null 2>&1; then
          echo "Backend key $$STORAGE_ACCESS_KEY exists, skipping"
        else
          rc admin service-account create local \
            "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" \
            --policy /tmp/aivis-backend-policy.json
          echo "Backend key $$STORAGE_ACCESS_KEY created"
        fi

        echo "Storage init completed"
    restart: "no"

volumes:
  # Physical names pinned, so that they do NOT carry the project name as a
  # prefix. Unpinned, `aivis_postgres_data` under project `aivis` would land on disk as
  # `aivis_aivis_postgres_data` -- the service name twice -- and would move again the day
  # the project name did. Pinned, the name on disk is the name written here.
  aivis_postgres_data:
    name: aivis_postgres_data
  aivis_redis_data:
    name: aivis_redis_data
  # The MinIO volume (aivis_minio_data) is deliberately NOT listed: the
  # move to RustFS (H32) leaves it on disk, unreferenced, as the rollback;
  # `aivis update` never runs `down -v`, so nothing removes it.
  aivis_storage_data:
    name: aivis_storage_data

networks:
  # Shared bus between the aivis stack and the comms stack. The comms stack
  # is its OWN compose project out of the comms repository -- none of its
  # five containers is described here, and none ever will be.
  #
  # EXTERNAL: compose requires this network to EXIST before `up`; it does
  # not create it. Whoever creates it first wins -- either side is fine,
  # the result is identical. It survives `docker compose down` (it is not
  # this project's network to remove).
  #
  # frontend / postgres / redis / storage / storage-init stay on the implicit
  # default network only; app is the only member (see its `networks:` key).
  aivis-shared:
    external: true
