name: aivis
# The compose PROJECT name, declared rather than inferred.
#
# Unset, compose derives it from the directory holding this file, which is an
# accident of the checkout layout: two stacks whose files both sit in `deploy/`
# resolve to ONE project, and one whose file sits in a repository root becomes
# `repo`. Same project means one label namespace -- `ps` from either directory
# lists the other's containers, every `up -d` reports the other's as orphans,
# and `down --remove-orphans` from either destroys the other.
#
# CONVENTION for every service on these servers: declare it here, first line,
# equal to the service name. A stack that does not is one directory rename away
# from colliding with a stack it has never heard of.
#
# Nothing observes this except a live docker daemon, so no test covers it.

# =============================================================================
# AIVIS.ONE -- Docker Compose
# =============================================================================
#
# Full stack: app + frontend + postgres + redis + minio
#
# Usage:
#   aivis update   -- pull, build, migrate, test, restart
#   aivis test     -- run tests inside container
#   aivis status   -- health check
#
#
# ENV FILES -- `app` is the only service that reads backend/.env. postgres,
# redis, minio and minio-init read NARROW PROJECTIONS of it
# (backend/.env.db, backend/.env.minio), generated by
# scripts/env-render.sh on every install and every update. A compromised
# datastore or object store therefore no longer holds the application's
# payment, telegram, session and comms-service secrets.
#
# Both projections are GENERATED and gitignored: compose refuses to run
# at all when an env_file is missing, so `aivis update` regenerates them
# before it touches the stack.
#
# Note: lives in repo root -- manages both backend/ and frontend/ contexts.
# =============================================================================

services:
  app:
    build: ./backend
    container_name: aivis-app
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    # Legal documents are authored in the frontend repo and consumed by
    # seed_documents.py inside this container. Read-only bind mount.
    volumes:
      - ./frontend/public/legal:/legal:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # The backend is the ONLY aivis service that talks to comms (the comms
    # API is internal -- no published port, no nginx route -- and resolves
    # by service name on aivis-shared only).
    # `default` is listed explicitly: the moment a service carries a
    # `networks:` key, compose stops attaching it to the default network
    # implicitly, and app would lose postgres / redis / minio.
    networks:
      - default        # intra-aivis traffic, unchanged
      - aivis-shared   # reach comms-app / comms-redis by name

  frontend:
    build: ./frontend
    container_name: aivis-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      app: { condition: service_healthy }
    # nginx listens on 0.0.0.0:3000 (IPv4 only). `localhost` inside the
    # container resolves AAAA first on some distros and the IPv6 probe
    # fails with "connection refused" -- use an explicit 127.0.0.1 so
    # the check never flips to unhealthy when nginx is actually serving.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: aivis-postgres
    env_file:
      - ./backend/.env.db
    volumes:
      - aivis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivis -d aivis"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # No published ports -- internal network only (security)

  redis:
    image: redis:7-alpine
    container_name: aivis-redis
    env_file:
      - ./backend/.env.db
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - aivis_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$REDIS_PASSWORD; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # No published ports -- internal network only (security)

  # ---------------------------------------------------------------------------
  # MinIO -- S3-compatible object storage for company attachments and templates.
  #
  # IMAGE PIN: RELEASE.2025-09-07T16-13-09Z is the last community image
  #   published to Docker Hub before MinIO archived their public image
  #   in October 2025. We pin to it so `docker compose pull` cannot
  #   silently move us to a different image (the :latest tag will
  #   eventually disappear from Docker Hub entirely).
  #
  #   The known privilege-escalation CVE in this version (GHSA-jjjj-jwhf-8rgr)
  #   does not affect us: MinIO is bound to 127.0.0.1, exposed only via
  #   nginx + basic-auth, and the only accounts are the root + backend
  #   service account both managed by install_aivis.sh.
  #
  # PORTS:
  #   9000 -- S3 API. Backend talks to it through the docker network as
  #           http://minio:9000; never exposed beyond the host loopback.
  #   9001 -- Web UI / Object Browser. Reachable from outside ONLY via
  #           nginx reverse proxy at https://storage-mc-admin.aivis.one
  #           with basic-auth (configured in install_aivis.sh).
  #
  # Healthcheck uses the live endpoint shipped with MinIO; curl is
  # included in the official minio/minio image.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aivis-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - ./backend/.env.minio
    volumes:
      - aivis_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO init -- one-shot bootstrap of buckets, anonymous policy, and
  # backend service account. Idempotent: reruns on every `docker compose up`
  # do not break anything; existing buckets / svcacct are detected and skipped.
  #
  # `restart: "no"` -- this container exits 0 after init and stays stopped.
  # `docker compose up -d` will not flag it as unhealthy because it has no
  # healthcheck and no restart policy.
  #
  # IMAGE PIN: RELEASE.2025-08-13T08-35-41Z is the last community mc
  #   image on Docker Hub before MinIO archived. Same rationale as the
  #   server image -- pin to a known good tag instead of :latest.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: aivis-minio-init
    depends_on:
      minio: { condition: service_healthy }
    env_file:
      - ./backend/.env.minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        # Configure mc alias inside the container -- talks to minio service
        # over the docker network (not 127.0.0.1).
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

        # Create main bucket (production attachments + templates) and test
        # bucket (used by backend integration tests). `mb -p` is idempotent.
        mc mb -p local/aivis-attachments
        mc mb -p local/aivis-attachments-test

        # Force private (no anonymous access). Even if a previous run set
        # a different policy, this resets it.
        mc anonymous set none local/aivis-attachments
        mc anonymous set none local/aivis-attachments-test

        # REFUSE ON EMPTY CREDENTIALS, BEFORE CREATING ANYTHING. Passed an
        # empty --access-key, mc mints a RANDOM one, prints "created" and
        # exits 0 -- an account exists, the report is green, and the
        # backend can never log in because it holds different keys. Same
        # class as the receiver's fail-closed on an empty webhook secret:
        # an unconfigured component must refuse, not improvise.
        if [ -z "$$MINIO_ACCESS_KEY" ] || [ -z "$$MINIO_SECRET_KEY" ]; then
          echo "MINIO_ACCESS_KEY / MINIO_SECRET_KEY are empty in .env.minio."
          echo "Refusing to create a service account with generated keys the"
          echo "backend does not have. Fix backend/.env and re-run."
          exit 1
        fi

        # Backend service account (one for both buckets).
        #
        # THE TEST IS "DO THESE CREDENTIALS WORK", NOT "DOES THE ACCOUNT
        # EXIST", and that is the whole point. What follows needs the
        # backend to be able to read the bucket with the keys in
        # .env.minio; asking that question directly answers it, while
        # asking whether an account is listed somewhere only answers it by
        # inference.
        #
        # WHAT WAS HERE BEFORE AND WHY IT NEVER RAN: the check was
        # `mc admin user svcacct ls ... | grep -qxF "$$MINIO_ACCESS_KEY"`.
        # There is no grep in the minio/mc image -- the shell reported
        # "grep: command not found", the condition was therefore ALWAYS
        # false, and the creation branch ran on every single start. The
        # comment above it explained at length why `-qxF` beat a substring
        # match, which made the missing binary that much harder to notice.
        # Nothing here now calls a binary the image does not ship: mc
        # alias and mc ls are the same commands this script already runs.
        if mc alias set svccheck http://minio:9000 \
             "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" > /dev/null 2>&1 \
           && mc ls svccheck/aivis-attachments > /dev/null 2>&1; then
          echo "Service account $$MINIO_ACCESS_KEY already works, skipping"
        else
          # KNOWN FALSE POSITIVE, NAMED RATHER THAN HIDDEN. The check
          # above asks whether the key can READ aivis-attachments. An
          # account that exists but has had its policy narrowed answers
          # no, and we land here with the key already taken -- mc then
          # refuses, set -e stops the container, and `aivis update` stops
          # with it (it inspects this exit code). That is the right
          # failure mode: loud, not silent. The hint exists so the
          # reader is not left guessing which of the two it is.
          if ! mc admin user svcacct add local "$$MINIO_ROOT_USER" \
               --access-key "$$MINIO_ACCESS_KEY" \
               --secret-key "$$MINIO_SECRET_KEY"; then
            echo ""
            echo "Could not create service account $$MINIO_ACCESS_KEY."
            echo "Two causes look identical from here:"
            echo "  * the key is genuinely new and creation failed, or"
            echo "  * the account already exists but cannot read"
            echo "    aivis-attachments, so the check above sent us here."
            echo "Inspect with: mc admin user svcacct ls local $$MINIO_ROOT_USER"
            exit 1
          fi
          echo "Service account $$MINIO_ACCESS_KEY created"
        fi

        echo "MinIO init completed"
    restart: "no"

volumes:
  # Physical names pinned, so that they do NOT carry the project name as a
  # prefix. Unpinned, `aivis_postgres_data` under project `aivis` would land on disk as
  # `aivis_aivis_postgres_data` -- the service name twice -- and would move again the day
  # the project name did. Pinned, the name on disk is the name written here.
  aivis_postgres_data:
    name: aivis_postgres_data
  aivis_redis_data:
    name: aivis_redis_data
  aivis_minio_data:
    name: aivis_minio_data

networks:
  # Shared bus between the aivis stack and the comms stack. The comms stack
  # is its OWN compose project out of the comms repository -- none of its
  # five containers is described here, and none ever will be.
  #
  # EXTERNAL: compose requires this network to EXIST before `up`; it does
  # not create it. Whoever creates it first wins -- either side is fine,
  # the result is identical. It survives `docker compose down` (it is not
  # this project's network to remove).
  #
  # frontend / postgres / redis / minio / minio-init stay on the implicit
  # default network only; app is the only member (see its `networks:` key).
  aivis-shared:
    external: true
