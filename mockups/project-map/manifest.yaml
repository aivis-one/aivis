flows:
  - id: inv.onboard
    name: "Investor: Register -> Dashboard"
    steps:
      - {screen: screen-register, endpoint: "POST /api/v1/auth/email/register", status: implemented}
      - {screen: screen-verify, endpoint: "POST /api/v1/auth/verify-email", status: gap}
      - {screen: screen-profile, endpoint: "PATCH /api/v1/users/me", status: planned}
      - {screen: screen-role, endpoint: "PATCH /api/v1/users/me", status: planned}
      - {screen: screen-kyc, endpoint: "POST /api/v1/kyc/submit", status: planned}
      - {screen: screen-docs, endpoint: "POST /api/v1/documents/{id}/sign", status: planned}
      - {screen: screen-dashboard, endpoint: "GET /api/v1/dashboard/summary", status: planned}
    score: 14

  - id: inv.purchase
    name: "Investor: Browse -> Buy"
    steps:
      - {screen: screen-dashboard, endpoint: "GET /api/v1/dashboard/summary", status: planned}
      - {screen: screen-market, endpoint: "GET /api/v1/products", status: planned}
      - {screen: screen-product, endpoint: "GET /api/v1/products/{id}", status: planned}
      - {screen: screen-purchase, endpoint: "POST /api/v1/products/{id}/purchase", status: planned}
    score: 0

  - id: agent.earn
    name: "Agent: Dashboard -> Withdraw"
    steps:
      - {screen: screen-dashboard, endpoint: "GET /api/v1/dashboard/summary", status: planned}
      - {screen: screen-hub, endpoint: "GET /api/v1/referrals/stats/me", status: planned}
      - {screen: screen-commissions, endpoint: "GET /api/v1/agent/commissions/me", status: planned}
      - {screen: screen-passive, endpoint: "POST /api/v1/withdrawals", status: planned}
    score: 0

  - id: staff.kyc
    name: "Staff: KYC Review"
    steps:
      - {screen: screen-dashboard, endpoint: "GET /api/v1/staff/dashboard/stats", status: planned}
      - {screen: screen-kyc, endpoint: "GET /api/v1/staff/kyc/queue", status: planned}
      - {screen: screen-kyc, endpoint: "POST /api/v1/staff/kyc/{id}/approve", status: planned}
    score: 0

  - id: comp.manage
    name: "Company: Product Management"
    steps:
      - {screen: screen-dashboard, endpoint: "GET /api/v1/dashboard/summary", status: planned}
      - {screen: screen-products, endpoint: "GET /api/v1/products", status: planned}
      - {screen: screen-product-edit, endpoint: "PATCH /api/v1/staff/products/{id}", status: planned}
    score: 0
